AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Demo environment for FSx for ONTAP SMB/NFS access blocking screenshots.
  Supports three AD patterns:
    A) create-new — Creates a new AWS Managed Microsoft AD
    B) use-existing-managed — Uses an existing AWS Managed AD (provide DirectoryId)
    C) use-self-managed — Uses a self-managed AD on EC2 or on-premises (provide DNS IPs)
  Also creates Windows EC2 (domain-joined) and Amazon Linux EC2 (NFS) instances.
  Designed for short-lived demo use — delete after capturing screenshots.
  VERIFIED: ONTAP 9.17.1P7D1, ap-northeast-1, July 2026.
  IMPORTANT: SVM AD join is a post-deploy step (see SvmAdJoinCommand output).
  Use 'Domain Admins' as FileSystemAdministratorsGroup (not 'AWS Delegated FSx Administrators').
  PREREQUISITE: VPC must have SSM Interface VPC Endpoints (ssm, ssmmessages, ec2messages)
  for SSM Session Manager access to EC2 instances in private subnets. Without these,
  you cannot connect to the Windows/Linux instances after deployment.
  Stack name pattern: fsxn-demo-ad-env

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: AD Pattern Selection
        Parameters:
          - AdMode
      - Label:
          default: "Pattern A: Create New AD"
        Parameters:
          - AdDomainName
          - AdPassword
      - Label:
          default: "Pattern B: Existing AWS Managed AD"
        Parameters:
          - ExistingDirectoryId
          - ExistingAdDomainName
          - ExistingAdDnsIps
      - Label:
          default: "Pattern C: Self-Managed AD (EC2 or on-premises)"
        Parameters:
          - SelfManagedAdDomainName
          - SelfManagedAdDnsIps
      - Label:
          default: Network Configuration
        Parameters:
          - VpcId
          - SubnetId
          - SubnetId2
          - SecurityGroupId
      - Label:
          default: EC2 Instances
        Parameters:
          - InstanceType
          - WindowsAmiId
          - LinuxAmiId
      - Label:
          default: FSx for ONTAP Integration
        Parameters:
          - FsxSvmId
          - FsxSvmDnsName
          - FsxVolumePath
          - NetBiosName

Parameters:
  # --- AD Pattern ---
  AdMode:
    Type: String
    Default: create-new
    AllowedValues:
      - create-new
      - use-existing-managed
      - use-self-managed
    Description: >-
      Which AD pattern to use:
        create-new — Deploy a new AWS Managed Microsoft AD (Standard, ~$0.30/hr)
        use-existing-managed — Join to your existing AWS Managed AD (provide DirectoryId)
        use-self-managed — Join to a self-managed AD on EC2 or on-premises (provide DNS IPs + credentials)

  # --- Pattern A: Create New ---
  AdDomainName:
    Type: String
    Default: demo.fsx.local
    Description: >-
      [Pattern A only] FQDN for the new AWS Managed AD.
      Ignored if AdMode is not 'create-new'.

  AdPassword:
    Type: String
    NoEcho: true
    Default: ''
    Description: >-
      [Pattern A only] Password for the new AD Admin user.
      Must meet complexity: 8+ chars, uppercase, lowercase, number, special char.
      Ignored if AdMode is not 'create-new'.

  # --- Pattern B: Existing Managed AD ---
  ExistingDirectoryId:
    Type: String
    Default: ''
    Description: >-
      [Pattern B only] Directory ID of your existing AWS Managed AD (d-xxxxxxxxxx).
      The Windows EC2 will be joined to this directory.
    AllowedPattern: '^(d-[0-9a-f]{10})?$'

  ExistingAdDomainName:
    Type: String
    Default: ''
    Description: >-
      [Pattern B only] FQDN of your existing AWS Managed AD (e.g., corp.example.com).
      Required: the SSM domain-join document needs the directory name, and
      demo-ad-join-svm.sh --ad-stack-name reads it from the DomainName output.
      Previously this resource read SelfManagedAdDomainName, a Pattern C field, so
      Pattern B joined with an empty directory name unless you filled in the wrong
      box.

  ExistingAdDnsIps:
    Type: String
    Default: ''
    Description: >-
      [Pattern B only] Comma-separated DNS IPs of your existing AD domain
      controllers. Example: 198.51.100.10,198.51.100.11
      Required: a Windows instance in a private subnet resolves through the VPC
      resolver, which cannot resolve the AD domain, and
      AWS-JoinDirectoryServiceDomain fails without reporting why. Look them up
      with:
        aws ds describe-directories --directory-ids <id> \
          --query 'DirectoryDescriptions[0].DnsIpAddrs'

  # --- Pattern C: Self-Managed AD ---
  # Pattern C configures DNS on the Windows instance and stops there. Joining a
  # self-managed domain needs a service-account password, and the only place this
  # template could put one is UserData -- which is readable from the instance
  # metadata service by anything running on the host and via
  # describe-instance-attribute. Run the join interactively instead (see the
  # SelfManagedJoinCommand output), where the password is not persisted.
  #
  # The SVM-side join to a self-managed AD is fully supported:
  #   bash shared/scripts/demo-ad-join-svm.sh --svm-id <id> \
  #     --domain <fqdn> --dns-ips '["ip1","ip2"]' --ou <dn> --ad-password <pass>
  #
  # SelfManagedAdUsername, SelfManagedAdPassword and SelfManagedAdOu were removed.
  # Nothing in the template read them, and the script takes --ad-username,
  # --ad-password and --ou directly. A NoEcho password parameter that is never
  # used reads as though the template handles the join.
  SelfManagedAdDomainName:
    Type: String
    Default: ''
    Description: >-
      [Pattern C only] FQDN of your self-managed AD domain (e.g., corp.example.com).

  SelfManagedAdDnsIps:
    Type: String
    Default: ''
    Description: >-
      [Pattern C only] Comma-separated DNS IP addresses of your AD domain controllers.
      Example: 198.51.100.10,198.51.100.11

  # --- Network ---
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC where FSx for ONTAP is deployed

  SubnetId:
    Type: AWS::EC2::Subnet::Id
    Description: Private subnet for EC2 instances (same AZ as FSx preferred ENI)

  SubnetId2:
    Type: AWS::EC2::Subnet::Id
    Description: >-
      Second subnet in a different AZ. Required for Pattern A (AWS Managed AD
      needs 2 AZs). For Pattern B/C, provide any valid subnet.

  SecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >-
      Security Group for EC2 instances. Must allow:
        - Outbound to AD DNS IPs: TCP 53, 88, 389, 445, 636; UDP 53, 88, 389
        - Outbound to FSx SVM: TCP 445 (SMB), TCP 2049 (NFS), TCP 111 (portmap)
      For demo, a VPC-wide allow-all SG is simplest.

  # --- EC2 ---
  InstanceType:
    Type: String
    Default: t3.medium
    AllowedValues: [t3.micro, t3.small, t3.medium, t3.large]
    Description: EC2 instance type (t3.medium recommended for Windows)

  WindowsAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-windows-latest/Windows_Server-2022-English-Full-Base
    Description: Windows Server 2022 AMI (auto-resolved)

  LinuxAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
    Description: Amazon Linux 2023 AMI (auto-resolved)

  # --- FSx for ONTAP ---
  FsxSvmId:
    Type: String
    Default: ''
    Description: >-
      FSx for ONTAP SVM ID to join to AD (svm-xxxxxxxxxxxxxxxxx).
      Used by the post-deploy script. Leave empty to skip SVM AD join.
    AllowedPattern: '^(svm-[0-9a-f]{17})?$'

  FsxSvmDnsName:
    Type: String
    Default: ''
    Description: >-
      SVM DNS name for mount commands.
      Example: svm-xxx.fs-xxx.fsx.ap-northeast-1.amazonaws.com

  FsxVolumePath:
    Type: String
    Default: /data
    Description: Junction path of the FSx volume to mount via NFS

  NetBiosName:
    Type: String
    Default: FSXNSVM
    MaxLength: 15
    Description: >-
      NetBIOS name for the SVM when joining AD (max 15 chars).
      IMPORTANT: Must be DIFFERENT from the AD domain's NetBIOS name (ShortName).
      For domain 'demo.fsx.local' (ShortName=demo), do NOT use 'DEMO' here.
      Must be unique across all SVMs joined to the same AD domain.

# Parameter validation, evaluated before any resource is created or updated. A
# stack that fails these never reaches the point of a silent domain-join failure.
#
# This is the fail-fast that was missing: every per-pattern parameter defaults to
# an empty string, because CloudFormation cannot mark a parameter required only for
# one value of another parameter. Without these rules, selecting Pattern B and
# leaving its fields blank produced a stack that reached CREATE_COMPLETE and an SSM
# association that failed with nothing in its status explaining why.
Rules:
  PatternARequiresPassword:
    RuleCondition: !Equals [!Ref AdMode, 'create-new']
    Assertions:
      - Assert: !Not [!Equals [!Ref AdPassword, '']]
        AssertDescription: >-
          AdMode=create-new requires AdPassword (8+ chars with upper, lower, digit
          and symbol) for the new AWS Managed AD Admin user.

  PatternBRequiresDirectoryDetails:
    RuleCondition: !Equals [!Ref AdMode, 'use-existing-managed']
    Assertions:
      - Assert: !Not [!Equals [!Ref ExistingDirectoryId, '']]
        AssertDescription: >-
          AdMode=use-existing-managed requires ExistingDirectoryId (d-xxxxxxxxxx).
      - Assert: !Not [!Equals [!Ref ExistingAdDomainName, '']]
        AssertDescription: >-
          AdMode=use-existing-managed requires ExistingAdDomainName. The SSM
          domain-join document needs the directory name, and demo-ad-join-svm.sh
          reads it from the DomainName output.
      - Assert: !Not [!Equals [!Ref ExistingAdDnsIps, '']]
        AssertDescription: >-
          AdMode=use-existing-managed requires ExistingAdDnsIps. A private-subnet
          instance resolves through the VPC resolver, which cannot resolve the AD
          domain, and AWS-JoinDirectoryServiceDomain then fails without reporting
          the reason in the association status.

  PatternCRequiresDomainAndDns:
    RuleCondition: !Equals [!Ref AdMode, 'use-self-managed']
    Assertions:
      - Assert: !Not [!Equals [!Ref SelfManagedAdDomainName, '']]
        AssertDescription: >-
          AdMode=use-self-managed requires SelfManagedAdDomainName.
      - Assert: !Not [!Equals [!Ref SelfManagedAdDnsIps, '']]
        AssertDescription: >-
          AdMode=use-self-managed requires SelfManagedAdDnsIps so the Windows
          instance can resolve the domain before you run the interactive join.

Conditions:
  CreateNewAd: !Equals [!Ref AdMode, 'create-new']
  UseExistingManagedAd: !Equals [!Ref AdMode, 'use-existing-managed']
  UseSelfManagedAd: !Equals [!Ref AdMode, 'use-self-managed']
  # Patterns A and B both target an AWS Managed AD, so they share the directory-ID
  # and DNS outputs that demo-ad-join-svm.sh reads.
  IsManagedAd: !Not [!Equals [!Ref AdMode, 'use-self-managed']]
  HasSvmId: !Not [!Equals [!Ref FsxSvmId, '']]

Resources:
  # ================================================================
  # AWS Managed Microsoft AD (Pattern A only)
  # ================================================================
  ManagedAD:
    Type: AWS::DirectoryService::MicrosoftAD
    Condition: CreateNewAd
    Properties:
      Name: !Ref AdDomainName
      Password: !Ref AdPassword
      Edition: Standard
      VpcSettings:
        VpcId: !Ref VpcId
        SubnetIds:
          - !Ref SubnetId
          - !Ref SubnetId2

  # ================================================================
  # IAM Role for EC2 (SSM + Domain Join)
  # ================================================================
  Ec2Role:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ec2-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        - arn:aws:iam::aws:policy/AmazonSSMDirectoryServiceAccess

  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      InstanceProfileName: !Sub '${AWS::StackName}-ec2-profile'
      Roles:
        - !Ref Ec2Role

  # ================================================================
  # Windows EC2 Instance (for SMB demo)
  # Domain join via SSM State Manager using AWS-managed document
  # ================================================================
  WindowsInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref WindowsAmiId
      InstanceType: !Ref InstanceType
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroupId
      IamInstanceProfile: !Ref Ec2InstanceProfile
      # DNS is set for all three patterns, not just Pattern A. An instance in a
      # private subnet resolves through the VPC resolver, which cannot resolve the
      # AD domain, and AWS-JoinDirectoryServiceDomain then fails with no error
      # visible in the association status -- only in the command output. Pattern B
      # previously got no DNS configuration at all.
      UserData: !Base64
        Fn::Sub:
          - |
            <powershell>
            # Point DNS at the AD domain controllers. Required before any domain
            # join: the VPC resolver cannot resolve the AD domain name.
            $adapter = Get-NetAdapter | Where-Object {$$_.Status -eq 'Up'} | Select-Object -First 1
            $dns = "${AdDnsIps}" -split ',' | Where-Object { $$_ -ne '' }
            if ($dns.Count -gt 0) {
              Set-DnsClientServerAddress -InterfaceIndex $adapter.InterfaceIndex -ServerAddresses $dns
              Write-Output "DNS set to: $($dns -join ', ')"
            } else {
              Write-Output "No AD DNS IPs supplied; domain join will fail until DNS is set."
            }
            </powershell>
          - AdDnsIps: !If
              - CreateNewAd
              - !Join [',', !GetAtt ManagedAD.DnsIpAddresses]
              - !If
                  - UseExistingManagedAd
                  - !Ref ExistingAdDnsIps
                  - !Ref SelfManagedAdDnsIps
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-windows-smb'
        - Key: Project
          Value: fsxn-observability
        - Key: Purpose
          Value: demo-screenshot-smb-access

  # SSM Association to join Windows instance to AD (Pattern A/B only)
  DomainJoinAssociation:
    Type: AWS::SSM::Association
    Condition: CreateNewAd
    Properties:
      Name: AWS-JoinDirectoryServiceDomain
      Targets:
        - Key: InstanceIds
          Values:
            - !Ref WindowsInstance
      Parameters:
        directoryId:
          - !Ref ManagedAD
        directoryName:
          - !Ref AdDomainName
        dnsIpAddresses:
          - !Select [0, !GetAtt ManagedAD.DnsIpAddresses]
          - !Select [1, !GetAtt ManagedAD.DnsIpAddresses]

  # Pattern C has no association on purpose. AWS-JoinDirectoryServiceDomain takes
  # a Directory Service directory ID, which a self-managed domain does not have,
  # and AD Connector has no CloudFormation resource type. See the
  # SelfManagedJoinCommand output for the interactive join.
  DomainJoinAssociationExisting:
    Type: AWS::SSM::Association
    Condition: UseExistingManagedAd
    Properties:
      Name: AWS-JoinDirectoryServiceDomain
      Targets:
        - Key: InstanceIds
          Values:
            - !Ref WindowsInstance
      Parameters:
        directoryId:
          - !Ref ExistingDirectoryId
        # Was !Ref SelfManagedAdDomainName -- a Pattern C parameter defaulting to
        # an empty string, so this join ran with no directory name.
        directoryName:
          - !Ref ExistingAdDomainName
        dnsIpAddresses: !Split [',', !Ref ExistingAdDnsIps]

  # ================================================================
  # Amazon Linux EC2 Instance (for NFS demo)
  # ================================================================
  LinuxInstance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: !Ref LinuxAmiId
      InstanceType: t3.micro
      SubnetId: !Ref SubnetId
      SecurityGroupIds:
        - !Ref SecurityGroupId
      IamInstanceProfile: !Ref Ec2InstanceProfile
      UserData: !Base64
        Fn::Sub: |
          #!/bin/bash
          yum install -y nfs-utils
          mkdir -p /mnt/fsxn
          cat > /root/mount-nfs.sh << 'SCRIPT'
          #!/bin/bash
          # NFS Mount Helper — run manually for screenshot timing
          SVM_DNS="${FsxSvmDnsName}"
          VOL_PATH="${FsxVolumePath}"
          echo "Mounting $SVM_DNS:$VOL_PATH to /mnt/fsxn..."
          mount -t nfs -o vers=3 "$SVM_DNS:$VOL_PATH" /mnt/fsxn
          echo "Done. Files:"
          ls -la /mnt/fsxn/
          SCRIPT
          chmod +x /root/mount-nfs.sh
      Tags:
        - Key: Name
          Value: !Sub '${AWS::StackName}-linux-nfs'
        - Key: Project
          Value: fsxn-observability
        - Key: Purpose
          Value: demo-screenshot-nfs-access

Outputs:
  AdMode:
    Description: AD pattern used
    Value: !Ref AdMode

  # ManagedAdId and DomainName are both read by
  # `demo-ad-join-svm.sh --ad-stack-name <stack>`. They used to be Pattern A only
  # (ManagedAdId) and Pattern A / Pattern C (DomainName), so for Pattern B the
  # script found no directory ID and an empty domain name. Both now cover A and B.
  ManagedAdId:
    Condition: IsManagedAd
    Description: "[Pattern A/B] AWS Managed AD Directory ID"
    Value: !If [CreateNewAd, !Ref ManagedAD, !Ref ExistingDirectoryId]

  ManagedAdDnsIps:
    Condition: IsManagedAd
    Description: "[Pattern A/B] AD DNS IP addresses"
    Value: !If
      - CreateNewAd
      - !Join [',', !GetAtt ManagedAD.DnsIpAddresses]
      - !Ref ExistingAdDnsIps

  DomainName:
    Description: AD domain name used
    Value: !If
      - CreateNewAd
      - !Ref AdDomainName
      - !If
          - UseExistingManagedAd
          - !Ref ExistingAdDomainName
          - !Ref SelfManagedAdDomainName

  WindowsInstanceId:
    Description: Windows EC2 Instance ID (connect via SSM Session Manager or Fleet Manager RDP)
    Value: !Ref WindowsInstance

  LinuxInstanceId:
    Description: Linux EC2 Instance ID (connect via SSM Session Manager)
    Value: !Ref LinuxInstance

  SelfManagedJoinCommand:
    Condition: UseSelfManagedAd
    Description: >-
      [Pattern C] The template sets DNS on the Windows instance but does not join
      it. Run this interactively over SSM Session Manager so the service-account
      password is not written to UserData, where the instance metadata service
      would expose it.
    Value: !Sub |
      # From SSM Session Manager on ${WindowsInstance} (PowerShell):
      $cred = Get-Credential          # prompts for the AD join account
      Add-Computer -DomainName ${SelfManagedAdDomainName} -Credential $cred -Restart
      # If your AD places computer objects in a specific OU, add:
      #   -OUPath "OU=FSxServers,DC=corp,DC=example,DC=com"

  SvmAdJoinCommand:
    Condition: HasSvmId
    Description: >-
      Post-deploy SVM AD join command. --ad-stack-name reads the DomainName and
      ManagedAdId outputs, so it covers Patterns A and B. For Pattern C pass
      --domain, --dns-ips and --ou explicitly instead.
    Value: !Sub |
      bash shared/scripts/demo-ad-join-svm.sh \
        --svm-id ${FsxSvmId} \
        --ad-stack-name ${AWS::StackName} \
        --ad-password '<your-ad-password>' \
        --netbios ${NetBiosName}

  PostDeploySteps:
    Description: Steps after stack creation
    Value: |
      === Post-Deploy Checklist ===
      0. [Required] Ensure SSM VPC Endpoints exist (ssm, ssmmessages, ec2messages):
         aws ec2 describe-vpc-endpoints --filters Name=vpc-id,Values=<vpc-id> --query 'VpcEndpoints[].ServiceName'
         If missing, create them:
         aws ec2 create-vpc-endpoint --vpc-id <vpc-id> --vpc-endpoint-type Interface \
           --service-name com.amazonaws.<region>.ssm --subnet-ids <subnet1>,<subnet2> \
           --security-group-ids <sg-id> --private-dns-enabled
         (repeat for ssmmessages and ec2messages)
      1. [~15 min] Wait for AD Active (Pattern A only):
         aws ds describe-directories --directory-ids <ManagedAdId output>
      2. [~5 min] Join SVM to AD:
         bash shared/scripts/demo-ad-join-svm.sh --svm-id <svm-id> --ad-stack-name <this-stack> --ad-password '<pass>'
      3. Create CIFS share (via ONTAP REST API from Linux EC2):
         curl -sk -u fsxadmin:<pass> -X POST "https://<mgmt-ip>/api/protocols/cifs/shares" \
           -H "Content-Type: application/json" \
           -d '{"name":"data","path":"/demo_data","svm":{"name":"<svm-name>"}}'
      4. Create a test AD user for the block demo:
         (From Windows via SSM PowerShell): New-ADUser -Name testuser -AccountPassword (ConvertTo-SecureString "P@ssw0rd123" -AsPlainText -Force) -Enabled $true
      5. Connect Windows via SSM Fleet Manager (RDP) or Session Manager (PowerShell):
         Map drive: net use Z: \\<svm-dns>\data /user:DEMO\testuser P@ssw0rd123
      6. Connect Linux via SSM Session Manager:
         bash /root/mount-nfs.sh
      7. Take "access granted" screenshots
      8. Trigger block (via SNS or direct Lambda invoke)
      9. Take "access denied" screenshots
      10. Unblock and delete this stack when done
      === IMPORTANT NOTES ===
      - Windows DNS must point to AD DNS IPs for domain join. UserData handles this
        for all three patterns (A from the new directory, B from ExistingAdDnsIps,
        C from SelfManagedAdDnsIps). Without it AWS-JoinDirectoryServiceDomain
        fails and the association status does not say why -- check the command
        output, not the association.
      - Pattern C joins the SVM but not the Windows instance. See the
        SelfManagedJoinCommand output: run Add-Computer interactively over Session
        Manager rather than putting a service-account password in UserData.
      - NFS export-policy deny rule is effective immediately (even for root clients)
      - Same-subnet NACL rules do NOT affect intra-subnet traffic — use export-policy for NFS blocking
      - MISCONFIGURED SVM: retry with corrected params (no SVM delete needed)
