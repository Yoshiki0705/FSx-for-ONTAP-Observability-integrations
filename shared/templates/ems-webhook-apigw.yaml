AWSTemplateFormatVersion: '2010-09-09'
Description: FSx for ONTAP EMS Webhook - REST API Gateway with Lambda integration for ONTAP EMS event reception

# DEPLOYMENT NOTE:
# This template creates named IAM roles (RoleName property), so deployment
# requires --capabilities CAPABILITY_NAMED_IAM (not just CAPABILITY_IAM).
# Example:
#   aws cloudformation deploy \
#     --template-file ems-webhook-apigw.yaml \
#     --stack-name fsxn-ems-webhook \
#     --capabilities CAPABILITY_NAMED_IAM

Parameters:
  LambdaFunctionArn:
    Type: String
    Description: ARN of the Lambda function to receive EMS Webhook events
    AllowedPattern: 'arn:aws:lambda:[a-z0-9-]+:\d{12}:function:.+'

  StageName:
    Type: String
    Default: prod
    Description: API Gateway deployment stage name
    MaxLength: 32

  ThrottlingRateLimit:
    Type: Number
    Default: 100
    MinValue: 1
    MaxValue: 10000
    Description: API Gateway throttling rate limit (requests per second)

  ThrottlingBurstLimit:
    Type: Number
    Default: 50
    MinValue: 1
    MaxValue: 5000
    Description: API Gateway throttling burst limit

  WebhookAuthMode:
    Type: String
    Default: NONE
    AllowedValues: [NONE, API_KEY, IAM, SHARED_SECRET]
    Description: >
      Authorization mode for the EMS webhook endpoint.
      NONE: No auth (quickstart/PoC only — NOT for production).
      API_KEY: Requires x-api-key header (create usage plan separately).
      IAM: Requires AWS IAM SigV4 signed requests.
      SHARED_SECRET: Lambda authorizer validates Bearer token against
        a secret stored in Secrets Manager (recommended for production
        when ONTAP cannot sign requests with SigV4).
      For production, use SHARED_SECRET, API_KEY, or IAM.

  WebhookSecretArn:
    Type: String
    Default: ''
    Description: >
      ARN of the Secrets Manager secret containing the webhook shared secret.
      Required when WebhookAuthMode is SHARED_SECRET.
      Secret format: {"webhook_secret": "<your-token>"}

  LogRetentionDays:
    Type: Number
    Default: 30
    AllowedValues:
      - 1
      - 3
      - 5
      - 7
      - 14
      - 30
      - 60
      - 90
      - 120
      - 150
      - 180
      - 365
    Description: CloudWatch Logs retention period in days

# WebhookSecretArn has to default to '' because it is only meaningful for
# WebhookAuthMode=SHARED_SECRET, and CloudFormation cannot express "required only
# when another parameter has a given value" on the parameter itself. This rule is
# that missing constraint. Without it, a SHARED_SECRET deployment with no secret
# ARN deploys cleanly and then rejects every ONTAP request at runtime, because the
# authorizer's WEBHOOK_SECRET_ARN is empty.
#
# Verified behaviour (throwaway probe stack, ap-northeast-1):
#   - create-stack and `aws cloudformation deploy`: the assertion fires before any
#     resource is created. It surfaces as a stack rollback, NOT as a CLI
#     ValidationError — create-stack exits 0 and the stack reaches
#     ROLLBACK_COMPLETE with "Parameter validation failed: assertion error:
#     <AssertDescription>". Read stack events, not just the exit code.
#   - create-change-set: rules are NOT evaluated at change set creation; they fire
#     on execute, which is still ahead of resource creation.
# https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/rules-section-structure.html
Rules:
  SharedSecretRequiresSecretArn:
    RuleCondition: !Equals [!Ref WebhookAuthMode, SHARED_SECRET]
    Assertions:
      - Assert: !Not [!Equals [!Ref WebhookSecretArn, '']]
        AssertDescription: >
          WebhookSecretArn is required when WebhookAuthMode is SHARED_SECRET.
          Provide the Secrets Manager ARN of a secret shaped
          {"webhook_secret": "<your-token>"}.

Conditions:
  UseApiKey: !Equals [!Ref WebhookAuthMode, API_KEY]
  UseSharedSecret: !Equals [!Ref WebhookAuthMode, SHARED_SECRET]

Resources:
  # Dead Letter Queue, provided for the operator to attach where it can help.
  #
  # It is intentionally NOT wired to the EMS Lambda's DeadLetterConfig: this
  # stack invokes that Lambda synchronously through API Gateway, and Lambda's
  # async DLQ only captures failures from asynchronous invocations. Attaching it
  # here would look like failure capture while catching nothing.
  #
  # Failures on the API Gateway path surface as 5xx responses to ONTAP instead,
  # so monitor them with the API Gateway 5XXError metric and the Lambda Errors
  # metric. ONTAP retries EMS webhook delivery on its own.
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-ems-dlq'
      MessageRetentionPeriod: 1209600
      Tags:
        - Key: Project
          Value: fsxn-observability
        - Key: Component
          Value: ems-webhook

  # CloudWatch Logs log group for API Gateway access logs
  ApiAccessLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/apigateway/${AWS::StackName}-ems-access'
      RetentionInDays: !Ref LogRetentionDays
      Tags:
        - Key: Project
          Value: fsxn-observability
        - Key: Component
          Value: ems-webhook

  # IAM Role for API Gateway to invoke Lambda
  ApiGatewayExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-apigw-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: apigateway.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: InvokeLambda
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource:
                  - !Ref LambdaFunctionArn
                  - !If
                    - UseSharedSecret
                    - !GetAtt AuthorizerFunction.Arn
                    - !Ref 'AWS::NoValue'

  # --- Lambda Authorizer (SHARED_SECRET mode) ---

  AuthorizerLambdaRole:
    Type: AWS::IAM::Role
    Condition: UseSharedSecret
    Properties:
      RoleName: !Sub '${AWS::StackName}-authorizer-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref WebhookSecretArn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-authorizer:*'

  AuthorizerFunction:
    Type: AWS::Lambda::Function
    Condition: UseSharedSecret
    Metadata:
      guard:
        dlq_exempt: >-
          Synchronous API Gateway Lambda authorizer; a failure denies the request and
          there is no async invocation to capture
    Properties:
      FunctionName: !Sub '${AWS::StackName}-authorizer'
      Runtime: python3.12
      Handler: index.lambda_handler
      Code:
        ZipFile: |
          # Generated from shared/lambda/authorizers/shared_secret_authorizer.py -- do not edit here.
          # Regenerate with: python3 shared/scripts/sync-inline-lambda.py
          # shared/python/tests/test_inline_lambda_sync.py fails if the two drift apart.
          """Lambda authorizer for EMS webhook shared secret authentication.

          Validates a bearer token or shared secret from the Authorization header
          against a value stored in AWS Secrets Manager. Returns an IAM policy
          allowing or denying the API Gateway method invocation.

          This is a REQUEST-type Lambda authorizer that checks the Authorization
          header for a Bearer token matching the secret stored in Secrets Manager.

          Environment variables:
              WEBHOOK_SECRET_ARN: ARN of the Secrets Manager secret containing
                  the shared secret as JSON: {"webhook_secret": "<token>"}

          Reference:
              https://docs.aws.amazon.com/apigateway/latest/developerguide/apigateway-use-lambda-authorizer.html
          """

          from __future__ import annotations

          import hmac
          import json
          import logging
          import os
          import time
          from typing import Any

          import boto3

          logger = logging.getLogger()
          logger.setLevel(os.environ.get("LOG_LEVEL", "INFO"))

          WEBHOOK_SECRET_ARN = os.environ.get("WEBHOOK_SECRET_ARN", "")

          # Module-level cache for the secret (persists across warm invocations)
          _secret_cache: str | None = None
          _secret_loaded_at: float = 0.0
          _SECRET_TTL = 300  # 5 minutes

          secrets_client = boto3.client("secretsmanager")


          def _get_webhook_secret() -> str:
              """Retrieve webhook secret from Secrets Manager with TTL cache.

              Returns:
                  The shared secret string.
              """
              global _secret_cache, _secret_loaded_at

              now = time.time()
              if _secret_cache is not None and (now - _secret_loaded_at) < _SECRET_TTL:
                  return _secret_cache

              response = secrets_client.get_secret_value(SecretId=WEBHOOK_SECRET_ARN)
              secret_data = json.loads(response["SecretString"])
              _secret_cache = secret_data["webhook_secret"]
              _secret_loaded_at = now
              logger.info("Loaded webhook secret from Secrets Manager")
              return _secret_cache


          def _generate_policy(
              principal_id: str, effect: str, resource: str
          ) -> dict[str, Any]:
              """Generate an IAM policy document for API Gateway.

              Args:
                  principal_id: Identifier for the caller.
                  effect: 'Allow' or 'Deny'.
                  resource: The API Gateway method ARN.

              Returns:
                  IAM policy document as a dictionary.
              """
              return {
                  "principalId": principal_id,
                  "policyDocument": {
                      "Version": "2012-10-17",
                      "Statement": [
                          {
                              "Action": "execute-api:Invoke",
                              "Effect": effect,
                              "Resource": resource,
                          }
                      ],
                  },
              }


          def lambda_handler(event: dict[str, Any], context: Any) -> dict[str, Any]:
              """Lambda authorizer entry point.

              Validates the Authorization header against the stored webhook secret.
              Accepts formats:
                  - Bearer <token>
                  - <token> (raw token without prefix)

              Args:
                  event: API Gateway authorizer event containing headers and methodArn.
                  context: Lambda context object.

              Returns:
                  IAM policy allowing or denying the request.

              Raises:
                  Exception: With message 'Unauthorized' for missing/invalid headers,
                      which API Gateway translates to HTTP 401.
              """
              # Extract Authorization header (case-insensitive lookup)
              headers = event.get("headers", {})
              auth_value = None
              for key, value in headers.items():
                  if key.lower() == "authorization":
                      auth_value = value
                      break

              if not auth_value:
                  logger.warning("No Authorization header present")
                  raise Exception("Unauthorized")  # noqa: TRY002 — API Gateway expects this

              # Strip 'Bearer ' prefix if present
              token = auth_value
              if token.lower().startswith("bearer "):
                  token = token[7:]

              token = token.strip()
              if not token:
                  logger.warning("Empty token in Authorization header")
                  raise Exception("Unauthorized")  # noqa: TRY002

              # Validate against stored secret
              try:
                  expected_secret = _get_webhook_secret()
              except Exception:
                  logger.exception("Failed to retrieve webhook secret")
                  raise Exception("Unauthorized")  # noqa: TRY002

              method_arn = event.get("methodArn", "*")

              # compare_digest rather than ==. A plain string comparison returns as soon as
              # it hits a differing byte, so the time it takes leaks how many leading bytes
              # of the submitted token were correct. Against an endpoint a caller can hit
              # repeatedly that is enough to recover the secret one byte at a time.
              if hmac.compare_digest(token, expected_secret):
                  logger.info("Authorization successful")
                  return _generate_policy("ontap-ems-webhook", "Allow", method_arn)

              logger.warning("Token mismatch — denying request")
              return _generate_policy("ontap-ems-webhook", "Deny", method_arn)
      Role: !GetAtt AuthorizerLambdaRole.Arn
      MemorySize: 128
      Timeout: 10
      Environment:
        Variables:
          WEBHOOK_SECRET_ARN: !Ref WebhookSecretArn

  AuthorizerLogGroup:
    Type: AWS::Logs::LogGroup
    Condition: UseSharedSecret
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-authorizer'
      RetentionInDays: !Ref LogRetentionDays

  WebhookAuthorizer:
    Type: AWS::ApiGateway::Authorizer
    Condition: UseSharedSecret
    Properties:
      Name: !Sub '${AWS::StackName}-shared-secret'
      RestApiId: !Ref EmsWebhookApi
      Type: REQUEST
      AuthorizerUri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${AuthorizerFunction.Arn}/invocations'
      AuthorizerCredentials: !GetAtt ApiGatewayExecutionRole.Arn
      IdentitySource: method.request.header.Authorization
      AuthorizerResultTtlInSeconds: 300

  # --- REST API Gateway ---

  # REST API Gateway
  EmsWebhookApi:
    Type: AWS::ApiGateway::RestApi
    Properties:
      Name: !Sub '${AWS::StackName}-ems-webhook'
      Description: REST API for receiving ONTAP EMS Webhook events
      EndpointConfiguration:
        Types:
          - REGIONAL

  # /ems resource
  EmsResource:
    Type: AWS::ApiGateway::Resource
    Properties:
      RestApiId: !Ref EmsWebhookApi
      ParentId: !GetAtt EmsWebhookApi.RootResourceId
      PathPart: ems

  # POST method on /ems with AWS_PROXY integration
  EmsPostMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref EmsWebhookApi
      ResourceId: !Ref EmsResource
      HttpMethod: POST
      AuthorizationType: !If [UseSharedSecret, CUSTOM, !Ref WebhookAuthMode]
      AuthorizerId: !If [UseSharedSecret, !Ref WebhookAuthorizer, !Ref 'AWS::NoValue']
      ApiKeyRequired: !If [UseApiKey, true, false]
      Integration:
        Type: AWS_PROXY
        IntegrationHttpMethod: POST
        Uri: !Sub 'arn:aws:apigateway:${AWS::Region}:lambda:path/2015-03-31/functions/${LambdaFunctionArn}/invocations'
        Credentials: !GetAtt ApiGatewayExecutionRole.Arn

  # Mock integration for non-POST methods returning 405
  EmsAnyMethod:
    Type: AWS::ApiGateway::Method
    Properties:
      RestApiId: !Ref EmsWebhookApi
      ResourceId: !Ref EmsResource
      HttpMethod: ANY
      AuthorizationType: NONE
      Integration:
        Type: MOCK
        RequestTemplates:
          application/json: '{"statusCode": 405}'
        IntegrationResponses:
          - StatusCode: '405'
            ResponseTemplates:
              application/json: '{"message": "Method Not Allowed"}'
      MethodResponses:
        - StatusCode: '405'
          ResponseModels:
            application/json: Empty

  # API Gateway Deployment
  EmsApiDeployment:
    Type: AWS::ApiGateway::Deployment
    DependsOn:
      - EmsPostMethod
      - EmsAnyMethod
    Properties:
      RestApiId: !Ref EmsWebhookApi

  # API Gateway Stage with access logging and throttling
  EmsApiStage:
    Type: AWS::ApiGateway::Stage
    Properties:
      RestApiId: !Ref EmsWebhookApi
      DeploymentId: !Ref EmsApiDeployment
      StageName: !Ref StageName
      AccessLogSetting:
        DestinationArn: !GetAtt ApiAccessLogGroup.Arn
        Format: '{"requestId":"$context.requestId","ip":"$context.identity.sourceIp","httpMethod":"$context.httpMethod","resourcePath":"$context.resourcePath","status":"$context.status","responseLatency":"$context.responseLatency"}'
      MethodSettings:
        - ResourcePath: /*
          HttpMethod: '*'
          ThrottlingRateLimit: !Ref ThrottlingRateLimit
          ThrottlingBurstLimit: !Ref ThrottlingBurstLimit

  # Lambda permission for API Gateway invocation
  LambdaInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LambdaFunctionArn
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${EmsWebhookApi}/*'

Outputs:
  ApiEndpointUrl:
    Description: Full invocation URL for the EMS Webhook endpoint
    Value: !Sub 'https://${EmsWebhookApi}.execute-api.${AWS::Region}.amazonaws.com/${StageName}/ems'

  ApiGatewayId:
    Description: REST API Gateway ID
    Value: !Ref EmsWebhookApi

  DeadLetterQueueArn:
    Description: >-
      ARN of the Dead Letter Queue. Not attached to the EMS Lambda by this
      stack — API Gateway invokes it synchronously, and Lambda's async DLQ does
      not capture synchronous failures. Monitor the API Gateway 5XXError and
      Lambda Errors metrics for this path instead.
    Value: !GetAtt DeadLetterQueue.Arn

  LambdaLogGroupName:
    Description: >-
      Note: This output provides the access log group name. The Lambda log group
      is managed by the Lambda function itself (typically /aws/lambda/<function-name>).
      Use the Lambda function name to derive the log group.
    Value: !Ref ApiAccessLogGroup

  AccessLogGroupName:
    Description: CloudWatch Logs log group for API Gateway access logs
    Value: !Ref ApiAccessLogGroup
