AWSTemplateFormatVersion: "2010-09-09"
Description: >
  FPolicy External Server on ECS Fargate.
  Runs the FPolicy TCP protocol handler that receives ONTAP FPolicy events
  and forwards them to SQS for downstream processing by vendor Lambdas.
  ONTAP connects directly to the Fargate task Private IP (not via NLB).

Parameters:
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: VPC ID where FSx for ONTAP resides

  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: Private subnets for Fargate task (same subnet as FSx for ONTAP SVM data LIF recommended)

  FsxnSvmSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Security Group ID of the FSx for ONTAP SVM (used as inbound source)

  ContainerImage:
    Type: String
    Description: >-
      FPolicy Server container image URI (ECR).
      IMPORTANT: Image MUST be built for linux/amd64 platform.
      Use: docker buildx build --platform linux/amd64 -t <uri> --push .
      Apple Silicon builds produce arm64-only images which will FAIL on Fargate.

  FPolicyPort:
    Type: Number
    Default: 9898
    Description: FPolicy TCP listening port

  WriteCompleteDelaySec:
    Type: Number
    Default: 5
    MinValue: 0
    MaxValue: 60
    Description: NFSv3 write-complete wait seconds

  SocketTimeoutSeconds:
    Type: Number
    Default: 300
    MinValue: 60
    MaxValue: 86400
    Description: >-
      Per-connection idle timeout on the FPolicy server socket. Must exceed the
      SVM's fpolicy keep-alive interval. Raise it when measuring how long an
      ONTAP session survives: a server-side timeout closes the socket exactly
      like an ONTAP-side disconnect, and the log cannot then tell them apart.

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
    Description: >-
      Server log level. DEBUG additionally logs the raw notification body, which
      is the only way to see which fields ONTAP actually sends at a given
      protocol version. It is verbose, so it is not the default.

  AssignPublicIp:
    Type: String
    Default: DISABLED
    AllowedValues: [DISABLED, ENABLED]
    Description: >-
      Whether the Fargate task ENI gets a public IP. DISABLED requires an egress
      path to ECR, CloudWatch Logs and SQS (NAT gateway or interface VPC
      endpoints). ENABLED is only for a subnet routed to an internet gateway
      that has no such path; the task is then reachable from the internet at the
      IP's open ports, so the task security group must stay restricted to the
      SVM security group as the sole inbound source.

  DesiredCount:
    Type: Number
    Default: 1
    MinValue: 0
    MaxValue: 3
    Description: Number of Fargate tasks

  Cpu:
    Type: String
    Default: "256"
    AllowedValues: ["256", "512", "1024"]
    Description: Fargate task CPU units

  Memory:
    Type: String
    Default: "512"
    AllowedValues: ["512", "1024", "2048"]
    Description: Fargate task memory (MB)

  EventBusName:
    Type: String
    Default: default
    Description: EventBridge bus name for FPolicy events

  MaxReceiveCount:
    Type: Number
    Default: 5
    MinValue: 1
    MaxValue: 1000
    Description: >-
      Receives of a single FPolicy message before it is redriven to the dead
      letter queue. AWS recommends at least 5: a receive is counted even when
      the whole batch failed for an unrelated reason (throttling, a transient
      backend error), so a low value sends healthy messages to the DLQ.
      https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-configure.html

  AlarmNotificationTopicArn:
    Type: String
    Default: ''
    Description: >-
      (Optional) SNS topic ARN notified when the DLQ or queue-backlog alarm
      fires. Leave empty to create the alarms without notification actions —
      they will be visible in the CloudWatch console but will not page anyone.

  QueueAgeAlarmThresholdSeconds:
    Type: Number
    Default: 900
    MinValue: 60
    MaxValue: 43200
    Description: >-
      Age of the oldest unprocessed FPolicy message that triggers the backlog
      alarm. This is the signal for a stalled consumer — most often a stale
      Fargate task IP registered on the ONTAP external engine, or a vendor
      Lambda that is failing every batch.

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmNotificationTopicArn, '']]

Resources:
  # ============================================================
  # SQS Queue for FPolicy events (+ Dead Letter Queue)
  #
  # The redrive policy is what makes per-message failure handling safe. Vendor
  # FPolicy Lambdas report individual failures via ReportBatchItemFailures, so a
  # message that can never be parsed is retried rather than deleted. Without a
  # redrive policy that message is retried forever: it blocks nothing (other
  # messages still flow) but it is never surfaced and never drained.
  #
  # ============================================================
  FPolicyDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-fpolicy-dlq"
      MessageRetentionPeriod: 1209600  # 14 days (maximum)
      KmsMasterKeyId: alias/aws/sqs
      Tags:
        - Key: Project
          Value: fsxn-observability
        - Key: Component
          Value: fpolicy

  FPolicyQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub "${AWS::StackName}-fpolicy-queue"
      # AWS recommends a visibility timeout of at least 6x the consuming
      # function's timeout, so a throttled retry still has headroom. Vendor
      # FPolicy Lambdas default to a 60s timeout, hence 360.
      # Hard constraint: the function timeout must be <= this value, or Lambda
      # rejects the event source mapping.
      # https://docs.aws.amazon.com/lambda/latest/dg/services-sqs-configure.html
      VisibilityTimeout: 360
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt FPolicyDeadLetterQueue.Arn
        maxReceiveCount: !Ref MaxReceiveCount
      Tags:
        - Key: Project
          Value: fsxn-observability
        - Key: Component
          Value: fpolicy

  # ============================================================
  # CloudWatch Alarms — FPolicy delivery health
  # ============================================================
  FPolicyDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-fpolicy-dlq-messages"
      AlarmDescription: >-
        Messages in the FPolicy Dead Letter Queue — these file operation events
        exhausted their retries and never reached the observability backend.
        Runbook: docs/en/runbooks/dlq-replay.md
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FPolicyDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmNotificationTopicArn
        - !Ref AWS::NoValue

  # Detects a stalled consumer. Queue depth alone is a poor signal here because
  # FPolicy traffic is bursty by nature — a deep queue that is draining is
  # normal, a queue whose oldest message keeps ageing is not.
  FPolicyQueueBacklogAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "${AWS::StackName}-fpolicy-queue-backlog"
      AlarmDescription: >-
        FPolicy events are not being consumed. Most common cause: the Fargate
        task restarted and ONTAP still points at the old task IP — re-register
        with `bash shared/scripts/fpolicy-update-engine-ip.sh --auto`.
        Otherwise check the vendor Lambda's error rate.
      Namespace: AWS/SQS
      MetricName: ApproximateAgeOfOldestMessage
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FPolicyQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: !Ref QueueAgeAlarmThresholdSeconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmNotificationTopicArn
        - !Ref AWS::NoValue

  # ============================================================
  # ECS Cluster
  # ============================================================
  FPolicyCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AWS::StackName}-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled

  # ============================================================
  # Security Group for FPolicy Server
  # ============================================================
  FPolicyServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: FPolicy Server - allows inbound TCP from FSx for ONTAP SVM
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: !Ref FPolicyPort
          ToPort: !Ref FPolicyPort
          SourceSecurityGroupId: !Ref FsxnSvmSecurityGroupId
          Description: FPolicy TCP from FSx for ONTAP SVM
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS outbound (SQS, ECR, CloudWatch)

  # ============================================================
  # IAM Role for ECS Task
  # ============================================================
  TaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-task-exec-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SQSSendMessage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                  - sqs:GetQueueAttributes
                Resource: !GetAtt FPolicyQueue.Arn

  # ============================================================
  # CloudWatch Log Group
  # ============================================================
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AWS::StackName}"
      RetentionInDays: 30

  # ============================================================
  # ECS Task Definition
  # ============================================================
  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AWS::StackName}"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref Cpu
      Memory: !Ref Memory
      ExecutionRoleArn: !GetAtt TaskExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: fpolicy-server
          Image: !Ref ContainerImage
          Essential: true
          PortMappings:
            - ContainerPort: !Ref FPolicyPort
              Protocol: tcp
          Environment:
            - Name: FPOLICY_PORT
              Value: !Sub "${FPolicyPort}"
            - Name: SQS_QUEUE_URL
              Value: !Ref FPolicyQueue
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: MODE
              Value: realtime
            - Name: WRITE_COMPLETE_DELAY_SEC
              Value: !Sub "${WriteCompleteDelaySec}"
            - Name: SOCKET_TIMEOUT_SEC
              Value: !Sub "${SocketTimeoutSeconds}"
            - Name: LOG_LEVEL
              Value: !Ref LogLevel
            - Name: SCHEMA_PATH
              Value: /app/schemas/fpolicy-event-schema.json
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: fpolicy

  # ============================================================
  # ECS Service
  # ============================================================
  FPolicyService:
    Type: AWS::ECS::Service
    Properties:
      ServiceName: !Sub "${AWS::StackName}-service"
      Cluster: !Ref FPolicyCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIp
          Subnets: !Ref SubnetIds
          SecurityGroups:
            - !Ref FPolicyServerSecurityGroup

  # ============================================================
  # EventBridge Rule: FPolicy events (for future EventBridge Pipe routing)
  # NOTE: The PRIMARY event flow is SQS → Lambda (event source mapping).
  # This rule exists for future use cases where EventBridge routing
  # to multiple consumers is needed.
  # ============================================================
  SqsToEventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-fpolicy-events"
      Description: >-
        FPolicy event pattern for future EventBridge-based routing.
        Primary flow uses SQS event source mapping to Lambda directly.
      EventBusName: !Ref EventBusName
      EventPattern:
        source:
          - fpolicy.fsxn
        detail-type:
          - FPolicy File Operation
      State: DISABLED

Outputs:
  ClusterArn:
    Description: ECS Cluster ARN
    Value: !GetAtt FPolicyCluster.Arn

  ServiceName:
    Description: ECS Service name
    Value: !Sub "${AWS::StackName}-service"

  FPolicyQueueUrl:
    Description: SQS Queue URL for FPolicy events
    Value: !Ref FPolicyQueue

  FPolicyQueueArn:
    Description: >-
      SQS Queue ARN. Pass this as FPolicySqsQueueArn when deploying a vendor
      FPolicy stack so the event source mapping is created.
    Value: !GetAtt FPolicyQueue.Arn

  FPolicyDeadLetterQueueUrl:
    Description: >-
      URL of the FPolicy Dead Letter Queue. Messages land here after 3 failed
      receives. Replay procedure: docs/en/runbooks/dlq-replay.md
    Value: !Ref FPolicyDeadLetterQueue

  FPolicyDeadLetterQueueArn:
    Description: ARN of the FPolicy Dead Letter Queue
    Value: !GetAtt FPolicyDeadLetterQueue.Arn

  SecurityGroupId:
    Description: FPolicy Server Security Group ID
    Value: !Ref FPolicyServerSecurityGroup

  LogGroupName:
    Description: CloudWatch Log Group for FPolicy server
    Value: !Ref LogGroup

  TaskDefinitionArn:
    Description: ECS Task Definition ARN
    Value: !Ref TaskDefinition
