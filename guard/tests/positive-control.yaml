# Deliberately compliant template. No rule in guard/rules/*.guard may report a
# finding against this file.
#
# This is the other half of the pair. negative-control.yaml catches rules that
# never fire; this one catches rules that fire on everything. An over-broad rule
# is not harmless -- it produces findings that are always dismissed, and once
# reviewers learn to dismiss a rule's output the rule has stopped working just as
# thoroughly as if it never ran.
#
# The cases below are the ones that actually tripped over-broad versions of these
# rules in this repository: ARN-shaped parameter names, intrinsic functions where
# a string was expected, and Lambda functions whose invocation model has no async
# DLQ.
Parameters:
  # Holds an ARN, not secret material. Must not be flagged for missing NoEcho.
  OntapCredentialsSecretArn:
    Type: String
    Default: 'arn:aws:secretsmanager:ap-northeast-1:123456789012:secret:example-XXXXXX'

  # Holds a secret name, not the value. Must not be flagged.
  VendorCredentialSecretName:
    Type: String
    Default: example-secret

  # A toggle that merely contains the word "Secrets". Must not be flagged.
  CreateSecretsManagerEndpoint:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']

  # Carries secret material and declares NoEcho. Must not be flagged.
  VpcCidrForSelfTest:
    Type: String
    Default: 10.0.0.0/16
    Description: Ingress CIDR supplied by parameter (struct at template scan time)
  AssignPublicIpForSelfTest:
    Type: String
    Default: DISABLED
    AllowedValues: [ENABLED, DISABLED]
    Description: AssignPublicIp supplied by parameter (struct at template scan time)
  VendorApiKey:
    Type: String
    NoEcho: true
    Default: ''

Conditions:
  ShouldCreateEndpoint: !Equals [!Ref CreateSecretsManagerEndpoint, 'true']

Resources:
  ScopedRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: scoped
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Ref OntapCredentialsSecretArn
              # Wildcard resource on actions AWS does not allow scoping. Must
              # not be flagged.
              - Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'

  CompliantDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs

  # Async invocation model, so it carries a real DLQ.
  CompliantAsyncFunction:
    Type: AWS::Lambda::Function
    Properties:
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt ScopedRole.Arn
      Timeout: 300
      MemorySize: 256
      DeadLetterConfig:
        TargetArn: !GetAtt CompliantDeadLetterQueue.Arn
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200}
      Environment:
        Variables:
          # Ends in 'Key' but references a secret ARN. Must not be flagged.
          VendorApiKey: 'arn:aws:secretsmanager:ap-northeast-1:123456789012:secret:example-XXXXXX'

  # Synchronous invocation model, so it declares an exemption instead.
  CompliantSyncFunction:
    Type: AWS::Lambda::Function
    Metadata:
      guard:
        dlq_exempt: >-
          Synchronous API Gateway integration; the async DLQ never fires. This
          resource exists to prove the exemption mechanism is honoured.
    Properties:
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt ScopedRole.Arn
      Timeout: 30
      MemorySize: 128
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              return {"statusCode": 200}

  # Credential env vars supplied by intrinsic functions. Comparing a struct
  # against a regex raises a ComparisonError that Guard counts as a violation, so
  # these must be filtered out by the rules rather than reported.
  CompliantTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      ContainerDefinitions:
        - Name: app
          Image: public.ecr.aws/nginx/nginx:latest
          Environment:
            - Name: ONTAP_CREDENTIALS_SECRET_ARN
              Value: !Ref OntapCredentialsSecretArn
            - Name: VENDOR_SECRET_NAME
              Value: !Sub '${VendorCredentialSecretName}-suffix'
            - Name: DB_PASSWORD
              Value: 'arn:aws:secretsmanager:ap-northeast-1:123456789012:secret:db-XXXXXX'

  # SecretString omitted; the value is written out of band.
  CompliantSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: guard-selftest-good-secret
      Description: Populated out of band with put-secret-value

  # SecretString supplied by a dynamic reference.
  CompliantResolveSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: guard-selftest-good-resolve-secret
      Description: Value comes from a dynamic reference
      SecretString: '{{resolve:ssm-secure:/example/key}}'

  # SecretString supplied by a NoEcho parameter.
  CompliantRefSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: guard-selftest-good-ref-secret
      Description: Value comes from a NoEcho parameter
      SecretString: !Ref VendorApiKey

  # ---------------------------------------------------------------------------
  # Shapes that are compliant but that the rules used to report as violations.
  #
  # Applying management-console-security.guard beyond management-console/templates/
  # produced 19 findings, and all but a handful were these four shapes rather than
  # real problems. Each one now has a filter in the rule file. They live here so
  # that removing a filter fails the self-test's "no rule fires on
  # positive-control.yaml" check, instead of quietly resurrecting the noise that
  # made the rule set unusable repo-wide.
  # ---------------------------------------------------------------------------

  # 1. A role with only ManagedPolicyArns and no inline Policies key.
  #    `Properties.Policies` cannot be traversed, and Guard reports the resulting
  #    RequiredPropertyError as non-compliance.
  CompliantManagedPolicyOnlyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy

  # 2. A conditionally included inline policy. The list entry is a struct whose
  #    only key is Fn::If, so it has no PolicyDocument to inspect.
  CompliantConditionalPolicyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AlwaysPresent
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                Resource: arn:aws:s3:::guard-selftest-bucket/*
        - !If
          - ShouldCreateEndpoint
          - PolicyName: OnlyWhenConditionTrue
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - sqs:SendMessage
                  Resource: arn:aws:sqs:us-east-1:123456789012:guard-selftest-queue
          - !Ref 'AWS::NoValue'

  # 3. A task security group whose ingress CIDR arrives by parameter. The value is
  #    a struct, and comparing a struct against "0.0.0.0/0" raises a
  #    ComparisonError that Guard counts as non-compliance.
  CompliantTaskSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Task security group for the ONTAP poller
      VpcId: vpc-0123456789abcdef0
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidrForSelfTest
          Description: HTTPS from within the VPC only

  # 4. An ECS service whose AssignPublicIp arrives by parameter — same struct
  #    comparison problem. Note this one needs a `when` rather than a filter: a
  #    filter applied to the AwsvpcConfiguration struct selects nothing, and the
  #    rule then reports SKIP, which is indistinguishable from a clean pass.
  CompliantEcsService:
    Type: AWS::ECS::Service
    Properties:
      Cluster: guard-selftest-cluster
      TaskDefinition: !Ref CompliantTaskDefinition
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: !Ref AssignPublicIpForSelfTest
          Subnets:
            - subnet-0123456789abcdef0
