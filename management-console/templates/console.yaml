AWSTemplateFormatVersion: '2010-09-09'
Description: >
  FSx for ONTAP Management Console - Console Stack (Stack 4 of 5)
  Creates ALB, ToolJet ECS service, RDS PostgreSQL, S3 Copy Lambda,
  temp S3 bucket, and supporting IAM roles.
  Depends on: fsxn-mgmt-network (Stack 1), fsxn-mgmt-auth (Stack 2),
  fsxn-mgmt-observability (Stack 3).

Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: Network Configuration (from Stack 1)
        Parameters:
          - VpcId
          - PrivateSubnetIds
          - PublicSubnetIds
          - AlbSgId
          - ToolJetTaskSgId
          - LambdaSgId
      - Label:
          default: Cluster Configuration (from Stack 3)
        Parameters:
          - EcsClusterArn
      - Label:
          default: Authentication (from Stack 2)
        Parameters:
          - CognitoUserPoolArn
          - CognitoAppClientId
          - CognitoDomain
      - Label:
          default: FSx for ONTAP Configuration
        Parameters:
          - OntapManagementEndpoints
          - OntapCredentialsSecretArns
          - S3AccessPointArn
      - Label:
          default: Application Configuration
        Parameters:
          - ToolJetImageTag
          - SessionDurationHours
          - CertificateArn
          - CustomDomainName
          - HostedZoneId
    ParameterLabels:
      VpcId:
        default: VPC ID
      PrivateSubnetIds:
        default: Private Subnet IDs (2+ AZs)
      PublicSubnetIds:
        default: Public Subnet IDs (2+ AZs)
      AlbSgId:
        default: ALB Security Group ID
      ToolJetTaskSgId:
        default: ToolJet Task Security Group ID
      LambdaSgId:
        default: Lambda Security Group ID
      EcsClusterArn:
        default: ECS Cluster ARN
      CognitoUserPoolArn:
        default: Cognito User Pool ARN
      CognitoAppClientId:
        default: Cognito App Client ID
      CognitoDomain:
        default: Cognito Domain Prefix
      OntapManagementEndpoints:
        default: ONTAP Management Endpoints (comma-separated)
      OntapCredentialsSecretArns:
        default: ONTAP Credentials Secret ARNs (comma-separated)
      S3AccessPointArn:
        default: S3 Access Point ARN
      ToolJetImageTag:
        default: ToolJet Container Image Tag
      SessionDurationHours:
        default: Session Duration (Hours)
      CertificateArn:
        default: ACM Certificate ARN
      CustomDomainName:
        default: Custom Domain Name
      HostedZoneId:
        default: Route 53 Hosted Zone ID

Parameters:
  PostgresEngineVersion:
    Type: String
    Default: '17'
    Description: >
      PostgreSQL engine version for the ToolJet metadata database. Defaults to the
      major version so the template keeps deploying as RDS deprecates individual
      minors; set an exact minor (e.g. 17.10) if your change control requires a pin.
      Check availability with:
      aws rds describe-db-engine-versions --engine postgres
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: >
      Target VPC where all management console resources are deployed.

  PrivateSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Private subnets for ECS Fargate tasks, RDS, and Lambda.
      Must span at least 2 Availability Zones.

  PublicSubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: >
      Public subnets for the Application Load Balancer.
      Must span at least 2 Availability Zones.

  AlbSgId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >
      Security Group ID for the ALB (from network stack).

  ToolJetTaskSgId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >
      Security Group ID for ToolJet ECS tasks (from network stack).

  LambdaSgId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: >
      Security Group ID for Lambda functions (from network stack).

  EcsClusterArn:
    Type: String
    Description: >
      ECS Cluster ARN (from observability stack).
    AllowedPattern: '^arn:aws:ecs:[a-z0-9-]+:[0-9]{12}:cluster/.+$'

  CognitoUserPoolArn:
    Type: String
    Description: >
      ARN of the Cognito User Pool for ALB authentication.
    AllowedPattern: '^arn:aws:cognito-idp:[a-z0-9-]+:[0-9]{12}:userpool/.+$'

  CognitoAppClientId:
    Type: String
    Description: >
      Cognito App Client ID configured for ALB integration.
    AllowedPattern: '^[a-z0-9]{26}$'

  CognitoDomain:
    Type: String
    Description: >
      Cognito hosted UI domain prefix.
    AllowedPattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$'
    MinLength: 1
    MaxLength: 63

  OntapManagementEndpoints:
    Type: String
    Description: >
      Comma-separated list of FSx for ONTAP management endpoints (1-10).
      Each endpoint corresponds positionally to a secret ARN in OntapCredentialsSecretArns.

  OntapCredentialsSecretArns:
    Type: String
    Description: >
      Comma-separated list of Secrets Manager ARNs containing ONTAP admin credentials (1-10).
      Each ARN corresponds positionally to an endpoint in OntapManagementEndpoints.

  S3AccessPointArn:
    Type: String
    Description: >
      ARN of the FSx for ONTAP S3 Access Point for file browsing.
    AllowedPattern: '^arn:aws:s3:[a-z0-9-]+:[0-9]{12}:accesspoint/[a-z0-9-]+$'

  ToolJetImageTag:
    Type: String
    Default: latest
    Description: >
      Container image tag for ToolJet management UI.
      Recommend pinning to an LTS version for production stability.

  SessionDurationHours:
    Type: Number
    Default: 8
    MinValue: 1
    MaxValue: 12
    Description: >
      Session duration in hours for ALB Cognito authentication.

  CertificateArn:
    Type: String
    Description: >
      ARN of an existing ACM certificate for HTTPS on the ALB.
    AllowedPattern: '^arn:aws:acm:[a-z0-9-]+:[0-9]{12}:certificate/[a-f0-9-]+$'

  CustomDomainName:
    Type: String
    Default: ''
    Description: >
      Custom domain name for the management console (e.g., fsxn-console.example.com).
      Leave empty to use ALB DNS.

  HostedZoneId:
    Type: String
    Default: ''
    Description: >
      Route 53 Hosted Zone ID for the custom domain.
      Required when CustomDomainName is set.

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainName, '']]

Resources:
  # ============================================================
  # CloudWatch Log Groups
  # ============================================================
  ToolJetLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /ecs/fsxn-mgmt/tooljet
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: fsxn-management-console
        - Key: Component
          Value: tooljet

  S3CopyLambdaLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: /aws/lambda/fsxn-mgmt-s3-copy
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: fsxn-management-console
        - Key: Component
          Value: s3-copy-lambda

  # ============================================================
  # Application Load Balancer
  # ============================================================
  ApplicationLoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: fsxn-mgmt-console-alb
      Scheme: internet-facing
      Type: application
      Subnets: !Ref PublicSubnetIds
      SecurityGroups:
        - !Ref AlbSgId
      Tags:
        - Key: Project
          Value: fsxn-management-console
        - Key: Component
          Value: alb

  # ============================================================
  # ALB Target Group (ToolJet)
  # ============================================================
  ToolJetTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: fsxn-mgmt-tooljet-tg
      Port: 3000
      Protocol: HTTP
      VpcId: !Ref VpcId
      TargetType: ip
      HealthCheckEnabled: true
      HealthCheckPath: /api/health
      HealthCheckProtocol: HTTP
      HealthCheckPort: '3000'
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 5
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher:
        HttpCode: '200'
      Tags:
        - Key: Project
          Value: fsxn-management-console

  # ============================================================
  # ALB Listener (HTTPS:443 with Cognito Auth)
  # ============================================================
  AlbHttpsListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ApplicationLoadBalancer
      Port: 443
      Protocol: HTTPS
      Certificates:
        - CertificateArn: !Ref CertificateArn
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      DefaultActions:
        - Type: authenticate-cognito
          Order: 1
          AuthenticateCognitoConfig:
            UserPoolArn: !Ref CognitoUserPoolArn
            UserPoolClientId: !Ref CognitoAppClientId
            UserPoolDomain: !Ref CognitoDomain
            SessionTimeout: !Ref SessionDurationHours
            OnUnauthenticatedRequest: authenticate
        - Type: forward
          Order: 2
          TargetGroupArn: !Ref ToolJetTargetGroup

  # ============================================================
  # ALB Listener Rules (path-based routing)
  # ============================================================

  # /health — no auth required (for external health checks)
  HealthCheckRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref AlbHttpsListener
      Priority: 1
      Conditions:
        - Field: path-pattern
          Values:
            - /health
      Actions:
        - Type: forward
          TargetGroupArn: !Ref ToolJetTargetGroup

  # /grafana/* — Cognito auth + redirect to AMG
  GrafanaRedirectRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref AlbHttpsListener
      Priority: 2
      Conditions:
        - Field: path-pattern
          Values:
            - /grafana/*
      Actions:
        - Type: authenticate-cognito
          Order: 1
          AuthenticateCognitoConfig:
            UserPoolArn: !Ref CognitoUserPoolArn
            UserPoolClientId: !Ref CognitoAppClientId
            UserPoolDomain: !Ref CognitoDomain
            SessionTimeout: !Ref SessionDurationHours
            OnUnauthenticatedRequest: authenticate
        - Type: forward
          Order: 2
          TargetGroupArn: !Ref ToolJetTargetGroup

  # /app/* — Cognito auth + forward to ToolJet
  AppForwardRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref AlbHttpsListener
      Priority: 3
      Conditions:
        - Field: path-pattern
          Values:
            - /app/*
      Actions:
        - Type: authenticate-cognito
          Order: 1
          AuthenticateCognitoConfig:
            UserPoolArn: !Ref CognitoUserPoolArn
            UserPoolClientId: !Ref CognitoAppClientId
            UserPoolDomain: !Ref CognitoDomain
            SessionTimeout: !Ref SessionDurationHours
            OnUnauthenticatedRequest: authenticate
        - Type: forward
          Order: 2
          TargetGroupArn: !Ref ToolJetTargetGroup

  # ============================================================
  # Route 53 DNS Record (Custom Domain → ALB Alias)
  # Only created when CustomDomainName is provided
  # ============================================================
  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasCustomDomain
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref CustomDomainName
      Type: A
      AliasTarget:
        DNSName: !GetAtt ApplicationLoadBalancer.DNSName
        HostedZoneId: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
        EvaluateTargetHealth: true

  # ============================================================
  # RDS PostgreSQL (ToolJet state database)
  # ============================================================
  RdsSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnets for ToolJet RDS PostgreSQL
      SubnetIds: !Ref PrivateSubnetIds
      Tags:
        - Key: Project
          Value: fsxn-management-console

  RdsSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS PostgreSQL security group - inbound from ToolJet tasks only
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ToolJetTaskSgId
          Description: Allow PostgreSQL from ToolJet tasks
      Tags:
        - Key: Name
          Value: fsxn-mgmt-rds-sg
        - Key: Project
          Value: fsxn-management-console

  ToolJetDatabase:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    Properties:
      DBInstanceIdentifier: fsxn-mgmt-tooljet-db
      DBInstanceClass: db.t3.medium
      Engine: postgres
      # Major version only. A pinned minor (this was '17.4') stops being usable
      # once RDS deprecates it — the template then fails at create time with
      # "engine version is deprecated and cannot be used to create new DB
      # instances", which is a broken template rather than a stale one. Pinning a
      # minor also has no runtime effect here because AutoMinorVersionUpgrade
      # defaults to true, so RDS moves the instance forward anyway. Override
      # PostgresEngineVersion if you need to pin an exact minor.
      EngineVersion: !Ref PostgresEngineVersion
      AutoMinorVersionUpgrade: true
      AllocatedStorage: 20
      StorageType: gp3
      MasterUsername: tooljet_admin
      ManageMasterUserPassword: true
      DBName: tooljet
      VPCSecurityGroups:
        - !Ref RdsSecurityGroup
      DBSubnetGroupName: !Ref RdsSubnetGroup
      MultiAZ: false
      PubliclyAccessible: false
      StorageEncrypted: true
      BackupRetentionPeriod: 7
      DeletionProtection: false
      Tags:
        - Key: Project
          Value: fsxn-management-console
        - Key: Component
          Value: tooljet-database

  # ============================================================
  # S3 Temp Bucket (presigned URL generation)
  # Lifecycle rule: 24h object expiry
  # ============================================================
  TempBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub 'fsxn-mgmt-temp-${AWS::AccountId}-${AWS::Region}'
      LifecycleConfiguration:
        Rules:
          - Id: ExpireObjectsAfter24Hours
            Status: Enabled
            ExpirationInDays: 1
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      Tags:
        - Key: Project
          Value: fsxn-management-console
        - Key: Component
          Value: temp-bucket

  # ============================================================
  # Dead Letter Queue (SQS) for Lambda
  # ============================================================
  S3CopyDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: fsxn-mgmt-s3-copy-dlq
      MessageRetentionPeriod: 1209600
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: fsxn-management-console
        - Key: Component
          Value: s3-copy-lambda

  # ============================================================
  # Lambda IAM Role (S3 Copy)
  # S3 AP read, temp bucket write, presign, DLQ send, VPC ENI
  # ============================================================
  S3CopyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3CopyLambdaPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: S3AccessPointRead
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:ListBucket
                Resource:
                  - !Ref S3AccessPointArn
                  - !Sub '${S3AccessPointArn}/object/*'
              - Sid: TempBucketWrite
                Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub '${TempBucket.Arn}/*'
              - Sid: TempBucketPresign
                Effect: Allow
                Action:
                  - s3:GetObject
                Resource: !Sub '${TempBucket.Arn}/*'
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${S3CopyLambdaLogGroup.Arn}:*'
              - Sid: DlqSend
                Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt S3CopyDeadLetterQueue.Arn
              - Sid: VpcNetworkInterface
                Effect: Allow
                Action:
                  - ec2:CreateNetworkInterface
                  - ec2:DescribeNetworkInterfaces
                  - ec2:DeleteNetworkInterface
                Resource: '*'
      Tags:
        - Key: Project
          Value: fsxn-management-console

  # ============================================================
  # Lambda Function (S3 Copy)
  # Copies from S3 AP to temp bucket, generates presigned URL
  # ============================================================
  S3CopyFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: fsxn-mgmt-s3-copy
      Runtime: python3.12
      Handler: index.lambda_handler
      Role: !GetAtt S3CopyLambdaRole.Arn
      Timeout: 300
      MemorySize: 512
      Code:
        ZipFile: |
          # Generated from management-console/lambda/s3_copy_handler.py -- do not edit here.
          # Regenerate with: python3 shared/scripts/sync-inline-lambda.py
          # shared/python/tests/test_inline_lambda_sync.py fails if the two drift apart.
          """S3 Copy Lambda for FSx for ONTAP Management Console.

          Copies files from FSx for ONTAP S3 Access Point to a standard S3 bucket
          and generates presigned URLs for download. FSx for ONTAP S3 APs do not
          support presigned URLs directly, so the copy-to-bucket pattern is required.

          Environment Variables:
              TEMP_BUCKET_NAME: Standard S3 bucket for temporary file storage.
              S3_ACCESS_POINT_ARN: Default S3 AP ARN (can be overridden per request).
              LOG_LEVEL: Logging level (default: INFO).
              PRESIGNED_URL_EXPIRY: Presigned URL expiry in seconds (default: 3600).
          """

          import logging
          import os
          import re
          import uuid
          from typing import Any

          import boto3
          from botocore.config import Config
          from botocore.exceptions import ClientError, ConnectTimeoutError

          # ─── Configuration from environment ────────────────────────────────────────

          TEMP_BUCKET_NAME = os.environ.get("TEMP_BUCKET_NAME", "")
          S3_ACCESS_POINT_ARN = os.environ.get("S3_ACCESS_POINT_ARN", "")
          LOG_LEVEL = os.environ.get("LOG_LEVEL", "INFO")
          PRESIGNED_URL_EXPIRY = int(os.environ.get("PRESIGNED_URL_EXPIRY", "3600"))

          # ─── Constants ──────────────────────────────────────────────────────────────

          MAX_FILE_SIZE_BYTES = 5 * 1024 * 1024 * 1024  # 5 GB
          S3_AP_CONNECT_TIMEOUT = 10  # seconds
          S3_AP_READ_TIMEOUT = 300  # seconds (large file copy)
          S3_AP_ARN_PATTERN = re.compile(
              r"^arn:aws:s3:[a-z0-9-]+:\d{12}:accesspoint/[a-zA-Z0-9\-]+$"
          )
          # Path traversal patterns to reject in object keys
          PATH_TRAVERSAL_PATTERN = re.compile(r"(^|/)\.\.(/|$)")

          # ─── Logger setup ──────────────────────────────────────────────────────────

          logger = logging.getLogger()
          logger.setLevel(getattr(logging, LOG_LEVEL, logging.INFO))

          # ─── S3 Clients ────────────────────────────────────────────────────────────

          # Client for S3 AP access — uses connect_timeout=10s for AP unreachable detection.
          # This client routes through NAT Gateway for internet-origin S3 APs.
          _s3_ap_config = Config(
              connect_timeout=S3_AP_CONNECT_TIMEOUT,
              read_timeout=S3_AP_READ_TIMEOUT,
              retries={"max_attempts": 2, "mode": "standard"},
          )
          _s3_ap_client = boto3.client("s3", config=_s3_ap_config)

          # Client for temp bucket operations (presigned URL generation).
          # Uses S3 Gateway Endpoint — no NAT Gateway needed.
          _s3_temp_client = boto3.client("s3")


          def validate_input(event: dict[str, Any]) -> tuple[str, str]:
              """Validate and extract S3 AP ARN and object key from the event.

              Args:
                  event: Lambda event payload containing 's3_access_point_arn' and
                      'object_key' fields.

              Returns:
                  Tuple of (s3_access_point_arn, object_key).

              Raises:
                  ValueError: If required fields are missing or invalid.
              """
              s3_ap_arn = event.get("s3_access_point_arn", "") or S3_ACCESS_POINT_ARN
              object_key = event.get("object_key", "")

              if not s3_ap_arn:
                  raise ValueError("Missing required field: 's3_access_point_arn'")

              if not object_key:
                  raise ValueError("Missing required field: 'object_key'")

              if not S3_AP_ARN_PATTERN.match(s3_ap_arn):
                  raise ValueError(
                      f"Invalid S3 Access Point ARN format: '{s3_ap_arn}'. "
                      "Expected: arn:aws:s3:<region>:<account-id>:accesspoint/<name>"
                  )

              # Reject path traversal attempts
              if PATH_TRAVERSAL_PATTERN.search(object_key):
                  raise ValueError(
                      f"Invalid object key: path traversal detected in '{object_key}'"
                  )

              # Reject empty segments or leading/trailing slashes that could be suspicious
              if object_key.startswith("/"):
                  raise ValueError(
                      f"Invalid object key: must not start with '/': '{object_key}'"
                  )

              return s3_ap_arn, object_key


          def check_file_size(s3_ap_arn: str, object_key: str) -> int:
              """Check the file size via HeadObject on the S3 Access Point.

              Args:
                  s3_ap_arn: S3 Access Point ARN to use as the Bucket parameter.
                  object_key: Object key to check.

              Returns:
                  File size in bytes.

              Raises:
                  ValueError: If file exceeds 5 GB limit.
                  ConnectionError: If S3 AP is unreachable within timeout.
                  ClientError: If HeadObject fails for other reasons.
              """
              try:
                  response = _s3_ap_client.head_object(Bucket=s3_ap_arn, Key=object_key)
              except ConnectTimeoutError as exc:
                  raise ConnectionError(
                      f"S3 Access Point unreachable within {S3_AP_CONNECT_TIMEOUT}s timeout. "
                      "Verify VPC endpoint configuration and NAT Gateway connectivity."
                  ) from exc
              except ClientError as exc:
                  error_code = exc.response.get("Error", {}).get("Code", "")
                  if error_code == "404" or error_code == "NoSuchKey":
                      raise ValueError(
                          f"Object not found: '{object_key}' in access point '{s3_ap_arn}'"
                      ) from exc
                  raise

              content_length = response.get("ContentLength", 0)

              if content_length > MAX_FILE_SIZE_BYTES:
                  raise ValueError(
                      f"File size {content_length / (1024**3):.2f} GB exceeds "
                      f"maximum downloadable limit of 5 GB."
                  )

              return content_length


          def copy_object_to_temp_bucket(
              s3_ap_arn: str, object_key: str, request_id: str
          ) -> str:
              """Copy object from S3 Access Point to the temp bucket.

              Uses GetObject from S3 AP + PutObject to temp bucket (streaming copy).
              The temp bucket has a 24h lifecycle rule for automatic cleanup.

              Args:
                  s3_ap_arn: S3 Access Point ARN.
                  object_key: Source object key.
                  request_id: Unique request ID for temp key namespacing.

              Returns:
                  The destination key in the temp bucket.

              Raises:
                  ConnectionError: If S3 AP is unreachable.
                  RuntimeError: If copy operation fails.
              """
              # Generate a unique temp key to avoid collisions
              # Format: tmp/<request_id>/<original_filename>
              filename = object_key.rsplit("/", 1)[-1] if "/" in object_key else object_key
              temp_key = f"tmp/{request_id}/{filename}"

              logger.info(
                  "Copying object from S3 AP to temp bucket",
                  extra={
                      "source_ap": s3_ap_arn,
                      "source_key": object_key,
                      "dest_bucket": TEMP_BUCKET_NAME,
                      "dest_key": temp_key,
                  },
              )

              try:
                  # Get object from S3 AP (routes through NAT Gateway)
                  get_response = _s3_ap_client.get_object(
                      Bucket=s3_ap_arn, Key=object_key
                  )

                  # Stream to temp bucket (routes through S3 Gateway Endpoint)
                  _s3_temp_client.put_object(
                      Bucket=TEMP_BUCKET_NAME,
                      Key=temp_key,
                      Body=get_response["Body"].read(),
                      ContentType=get_response.get("ContentType", "application/octet-stream"),
                  )

              except ConnectTimeoutError as exc:
                  raise ConnectionError(
                      f"S3 Access Point unreachable within {S3_AP_CONNECT_TIMEOUT}s timeout. "
                      "Verify VPC endpoint configuration and NAT Gateway connectivity."
                  ) from exc
              except ClientError as exc:
                  error_code = exc.response.get("Error", {}).get("Code", "")
                  error_msg = exc.response.get("Error", {}).get("Message", "")
                  raise RuntimeError(
                      f"Copy operation failed: [{error_code}] {error_msg}"
                  ) from exc

              logger.info(
                  "Object copied successfully to temp bucket",
                  extra={"dest_bucket": TEMP_BUCKET_NAME, "dest_key": temp_key},
              )

              return temp_key


          def generate_presigned_url(temp_key: str) -> str:
              """Generate a presigned URL for the copied object in the temp bucket.

              Args:
                  temp_key: Object key in the temp bucket.

              Returns:
                  Presigned URL with configured expiry (default 3600s).
              """
              url = _s3_temp_client.generate_presigned_url(
                  "get_object",
                  Params={"Bucket": TEMP_BUCKET_NAME, "Key": temp_key},
                  ExpiresIn=PRESIGNED_URL_EXPIRY,
              )

              logger.info(
                  "Presigned URL generated",
                  extra={
                      "temp_key": temp_key,
                      "expiry_seconds": PRESIGNED_URL_EXPIRY,
                  },
              )

              return url


          def lambda_handler(event: dict[str, Any], context: Any) -> dict[str, Any]:
              """Lambda entry point for S3 copy and presigned URL generation.

              Copies a file from FSx for ONTAP S3 Access Point to a standard S3 bucket
              and returns a presigned URL for download. This is required because
              FSx for ONTAP S3 APs do not support presigned URLs directly.

              Args:
                  event: Lambda event with fields:
                      - s3_access_point_arn (str): S3 AP ARN (optional if env var set).
                      - object_key (str): Object key to download.
                  context: Lambda context object.

              Returns:
                  Response dict with:
                      - statusCode (int): HTTP status code.
                      - body (dict): Contains 'presigned_url', 'object_key',
                        'file_size_bytes', and 'expiry_seconds' on success,
                        or 'error' and 'message' on failure.
              """
              request_id = getattr(context, "aws_request_id", str(uuid.uuid4()))

              logger.info(
                  "S3 copy request received",
                  extra={"request_id": request_id, "event_keys": list(event.keys())},
              )

              try:
                  # Step 1: Validate input
                  s3_ap_arn, object_key = validate_input(event)
                  logger.info(
                      "Input validated",
                      extra={
                          "request_id": request_id,
                          "s3_ap_arn": s3_ap_arn,
                          "object_key": object_key,
                      },
                  )

                  # Step 2: Check file size (reject > 5 GB)
                  file_size = check_file_size(s3_ap_arn, object_key)
                  logger.info(
                      "File size validated",
                      extra={
                          "request_id": request_id,
                          "file_size_bytes": file_size,
                          "file_size_mb": round(file_size / (1024 * 1024), 2),
                      },
                  )

                  # Step 3: Copy object from S3 AP to temp bucket
                  temp_key = copy_object_to_temp_bucket(s3_ap_arn, object_key, request_id)

                  # Step 4: Generate presigned URL from temp bucket
                  presigned_url = generate_presigned_url(temp_key)

                  logger.info(
                      "S3 copy request completed successfully",
                      extra={"request_id": request_id, "object_key": object_key},
                  )

                  return {
                      "statusCode": 200,
                      "body": {
                          "presigned_url": presigned_url,
                          "object_key": object_key,
                          "file_size_bytes": file_size,
                          "expiry_seconds": PRESIGNED_URL_EXPIRY,
                      },
                  }

              except ValueError as exc:
                  logger.warning(
                      "Validation error",
                      extra={"request_id": request_id, "error": str(exc)},
                  )
                  return {
                      "statusCode": 400,
                      "body": {
                          "error": "ValidationError",
                          "message": str(exc),
                      },
                  }

              except ConnectionError as exc:
                  logger.error(
                      "S3 Access Point connectivity error",
                      extra={"request_id": request_id, "error": str(exc)},
                  )
                  return {
                      "statusCode": 504,
                      "body": {
                          "error": "AccessPointUnreachable",
                          "message": str(exc),
                      },
                  }

              except RuntimeError as exc:
                  logger.error(
                      "Copy operation failed",
                      extra={"request_id": request_id, "error": str(exc)},
                  )
                  return {
                      "statusCode": 502,
                      "body": {
                          "error": "CopyFailed",
                          "message": str(exc),
                      },
                  }

              except Exception as exc:
                  logger.exception(
                      "Unexpected error during S3 copy",
                      extra={"request_id": request_id},
                  )
                  return {
                      "statusCode": 500,
                      "body": {
                          "error": "InternalError",
                          "message": f"Unexpected error: {type(exc).__name__}: {exc}",
                      },
                  }
      VpcConfig:
        SubnetIds: !Ref PrivateSubnetIds
        SecurityGroupIds:
          - !Ref LambdaSgId
      DeadLetterConfig:
        TargetArn: !GetAtt S3CopyDeadLetterQueue.Arn
      Environment:
        Variables:
          TEMP_BUCKET_NAME: !Ref TempBucket
          S3_ACCESS_POINT_ARN: !Ref S3AccessPointArn
          PRESIGN_EXPIRY_SECONDS: '3600'
      Tags:
        - Key: Project
          Value: fsxn-management-console
        - Key: Component
          Value: s3-copy-lambda

  # ============================================================
  # ToolJet IAM Task Execution Role (ECR pull + CloudWatch Logs)
  # ============================================================
  ToolJetTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ToolJetTaskExecutionPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: EcrAuth
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Sid: EcrPull
                Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource: !Sub 'arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/*'
              - Sid: CloudWatchLogs
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${ToolJetLogGroup.Arn}:*'
              - Sid: RdsSecretRead
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !GetAtt ToolJetDatabase.MasterUserSecret.SecretArn
      Tags:
        - Key: Project
          Value: fsxn-management-console

  # ============================================================
  # ToolJet IAM Task Role (Secrets Manager read + Lambda invoke)
  # ============================================================
  ToolJetTaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: ToolJetTaskPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: SecretsManagerRead
                Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource: !Split [',', !Ref OntapCredentialsSecretArns]
              - Sid: LambdaInvoke
                Effect: Allow
                Action:
                  - lambda:InvokeFunction
                Resource: !GetAtt S3CopyFunction.Arn
      Tags:
        - Key: Project
          Value: fsxn-management-console

  # ============================================================
  # ECS Task Definition (ToolJet)
  # ============================================================
  ToolJetTaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: fsxn-mgmt-tooljet
      Cpu: '1024'
      Memory: '2048'
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      ExecutionRoleArn: !GetAtt ToolJetTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ToolJetTaskRole.Arn
      ContainerDefinitions:
        - Name: tooljet
          Image: !Sub 'tooljet/tooljet:${ToolJetImageTag}'
          Cpu: 1024
          Memory: 2048
          Essential: true
          PortMappings:
            - ContainerPort: 3000
              Protocol: tcp
          Environment:
            - Name: TOOLJET_HOST
              Value: !If
                - HasCustomDomain
                - !Sub 'https://${CustomDomainName}'
                - !Sub 'https://${ApplicationLoadBalancer.DNSName}'
            - Name: ONTAP_MGMT_ENDPOINTS
              Value: !Ref OntapManagementEndpoints
            - Name: ONTAP_CREDENTIALS_SECRET_ARNS
              Value: !Ref OntapCredentialsSecretArns
            - Name: S3_COPY_LAMBDA_ARN
              Value: !GetAtt S3CopyFunction.Arn
            - Name: AWS_REGION
              Value: !Ref AWS::Region
            - Name: DATABASE_URL
              Value: !Sub
                - 'postgresql://${ToolJetDatabase.Endpoint.Address}:5432/tooljet'
                - {}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref ToolJetLogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: tooljet
          HealthCheck:
            Command:
              - CMD-SHELL
              - 'wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1'
            Interval: 30
            Timeout: 5
            Retries: 3
            StartPeriod: 120

  # ============================================================
  # ECS Service (ToolJet, desired count: 1)
  # ============================================================
  ToolJetService:
    Type: AWS::ECS::Service
    DependsOn:
      - AlbHttpsListener
    Properties:
      ServiceName: fsxn-mgmt-tooljet
      Cluster: !Ref EcsClusterArn
      TaskDefinition: !Ref ToolJetTaskDefinition
      DesiredCount: 1
      LaunchType: FARGATE
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: !Ref PrivateSubnetIds
          SecurityGroups:
            - !Ref ToolJetTaskSgId
      LoadBalancers:
        - ContainerName: tooljet
          ContainerPort: 3000
          TargetGroupArn: !Ref ToolJetTargetGroup
      DeploymentConfiguration:
        DeploymentCircuitBreaker:
          Enable: true
          Rollback: true
        MaximumPercent: 200
        MinimumHealthyPercent: 100
      EnableExecuteCommand: true
      Tags:
        - Key: Project
          Value: fsxn-management-console
        - Key: Component
          Value: tooljet

# ============================================================
# Outputs
# ============================================================
Outputs:
  AlbDnsName:
    Description: Application Load Balancer DNS name
    Value: !GetAtt ApplicationLoadBalancer.DNSName
    Export:
      Name: !Sub '${AWS::StackName}-AlbDnsName'

  AlbArn:
    Description: Application Load Balancer ARN
    Value: !Ref ApplicationLoadBalancer
    Export:
      Name: !Sub '${AWS::StackName}-AlbArn'

  AlbHostedZoneId:
    Description: ALB Hosted Zone ID (for Route 53 alias records)
    Value: !GetAtt ApplicationLoadBalancer.CanonicalHostedZoneID
    Export:
      Name: !Sub '${AWS::StackName}-AlbHostedZoneId'

  ToolJetServiceArn:
    Description: ToolJet ECS Service ARN
    Value: !Ref ToolJetService
    Export:
      Name: !Sub '${AWS::StackName}-ToolJetServiceArn'

  ToolJetServiceName:
    Description: ToolJet ECS Service name
    Value: !GetAtt ToolJetService.Name
    Export:
      Name: !Sub '${AWS::StackName}-ToolJetServiceName'

  TempBucketName:
    Description: Temp S3 bucket name for presigned URL generation
    Value: !Ref TempBucket
    Export:
      Name: !Sub '${AWS::StackName}-TempBucketName'

  TempBucketArn:
    Description: Temp S3 bucket ARN
    Value: !GetAtt TempBucket.Arn
    Export:
      Name: !Sub '${AWS::StackName}-TempBucketArn'

  S3CopyFunctionArn:
    Description: S3 Copy Lambda function ARN
    Value: !GetAtt S3CopyFunction.Arn
    Export:
      Name: !Sub '${AWS::StackName}-S3CopyFunctionArn'

  ToolJetTargetGroupArn:
    Description: ToolJet ALB Target Group ARN
    Value: !Ref ToolJetTargetGroup
    Export:
      Name: !Sub '${AWS::StackName}-ToolJetTargetGroupArn'

  RdsEndpoint:
    Description: RDS PostgreSQL endpoint address
    Value: !GetAtt ToolJetDatabase.Endpoint.Address
    Export:
      Name: !Sub '${AWS::StackName}-RdsEndpoint'

  RdsSecretArn:
    Description: RDS master user secret ARN (managed by RDS)
    Value: !GetAtt ToolJetDatabase.MasterUserSecret.SecretArn
    Export:
      Name: !Sub '${AWS::StackName}-RdsSecretArn'

  ConsoleUrl:
    Description: Management console URL (custom domain or ALB DNS)
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${CustomDomainName}'
      - !Sub 'https://${ApplicationLoadBalancer.DNSName}'
    Export:
      Name: !Sub '${AWS::StackName}-ConsoleUrl'

  CognitoCallbackUrl:
    Description: Cognito OAuth2 callback URL (must be added to User Pool Client CallbackURLs)
    Value: !If
      - HasCustomDomain
      - !Sub 'https://${CustomDomainName}/oauth2/idpresponse'
      - !Sub 'https://${ApplicationLoadBalancer.DNSName}/oauth2/idpresponse'
    Export:
      Name: !Sub '${AWS::StackName}-CognitoCallbackUrl'
