name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12']
        node-version: ['20']

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Node dependencies
        run: npm ci

      # Pinned, from requirements-dev.txt. The previous unpinned install meant
      # CI resolved whatever was newest while local runs used whatever was
      # already present, so the same code could lint clean in one place and
      # fail in the other with no version difference visible in the log.
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt

      # Now blocking. It was continue-on-error, and there was no eslint config
      # of any kind: ESLint 9 dropped .eslintrc and neither it nor
      # eslint.config.js existed, so `npm run lint` exited 2 on a configuration
      # error rather than on a lint result. The skip below meant that never
      # surfaced -- the repo has no .ts files today -- so the gate was broken
      # precisely for the moment someone added one. eslint.config.js now exists
      # and is verified to fail on an unused variable and unreachable code.
      - name: TypeScript lint
        run: |
          if find . -name "*.ts" -not -path "*/node_modules/*" | grep -q .; then
            npm run lint
          else
            echo "No TypeScript files found, skipping lint"
          fi

      - name: TypeScript tests
        run: npx jest --passWithNoTests

      # One target, one path list. This job previously carried its own inline
      # vendor list while AGENTS.md documented a different and staler one;
      # scripts/verification/tests (172 tests) and
      # shared/lambda-layers/log-parser/tests (12 tests) appeared in neither and
      # so ran nowhere. The list now lives only in the Makefile
      # (PYTEST_DIRS), and scripts/tests/test_test_dir_coverage.py fails when a
      # tests/ directory on disk is missing from it.
      #
      # The target runs one pytest process per directory. Vendors share module
      # names (lambda/handler.py, tests/test_fpolicy_handler.py) and each
      # conftest puts its own lambda/ dir on sys.path, so a single combined
      # process yields 193 failures and 43 errors purely from collisions.
      - name: Python tests (all suites, list from Makefile)
        run: make test-py

      # Drift guards: .PHONY coverage, test-directory coverage, bandit baseline
      # integrity, always-loaded context budget. These fail when the
      # configuration stops describing reality.
      - name: Drift guards
        run: make drift

      # ruff blocking tier (ruff.toml [lint] select): rules that only fire on a
      # definite defect. Clean at adoption, so a red result is a regression.
      - name: Python lint (blocking tier)
        run: make lint-py

      # bandit. Had never run against this repo before: the first execution
      # reported 6 Medium findings, all B314 (stdlib ElementTree parsing audit
      # XML whose content originates from whoever touches the volume). Those 6
      # are recorded in .bandit-baseline.json and are an open decision; any
      # finding beyond them fails this step.
      - name: Python security scan
        run: make security

      - name: Python tests - Shared Parser (log-parser v1.1.0)
        env:
          AWS_DEFAULT_REGION: ap-northeast-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
          AWS_SECURITY_TOKEN: testing
          AWS_SESSION_TOKEN: testing
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'shared/lambda-layers/log-parser/python')
          from fsxn_log_parser import parse, detect_format, validate_event, __version__
          assert __version__ == '1.1.0', f'Expected 1.1.0, got {__version__}'
          # Smoke test: XML parse
          xml = b'<Event><System><EventID>4663</EventID><TimeCreated SystemTime=\"2026-01-01T00:00:00Z\"/><Computer>SVM</Computer></System><EventData><Data Name=\"SubjectUserName\">user</Data><Data Name=\"ObjectName\">/test</Data><Data Name=\"Keywords\">Audit Success</Data></EventData></Event>'
          result = parse(xml, key='test.xml')
          assert result['event_count'] == 1
          assert result['format'] == 'xml'
          assert result['events'][0]['user'] == 'user'
          # Format detection
          assert detect_format(b'ElfFile\x00test', '') == 'evtx'
          assert detect_format(b'{\"test\":1}', '') == 'json'
          assert detect_format(xml, '') == 'xml'
          # Validation
          errors = validate_event(result['events'][0])
          assert errors == []
          print(f'Parser v{__version__} smoke test passed.')
          "

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-report
          path: coverage-html/
          retention-days: 14

      # Now blocking. It was continue-on-error, which meant a real finding and a
      # usage error both rendered as a green step -- and the invocation had in
      # fact been failing on a missing `--` separator, so the integrations
      # templates went unlinted while the step reported success. Measured clean
      # across all 59 templates at the pinned cfn-lint 1.55.1, so making it
      # blocking cannot start red.
      #
      # cfn-lint version is pinned in requirements-dev.txt: an unpinned install
      # meant CI silently adopted new checks the moment they shipped.
      - name: Validate CloudFormation templates
        run: make cfn-lint

  cfn-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Install cfn-guard
        run: |
          curl -L https://github.com/aws-cloudformation/cloudformation-guard/releases/latest/download/cfn-guard-v3-ubuntu-latest.tar.gz -o cfn-guard.tar.gz
          tar -xzf cfn-guard.tar.gz
          sudo mv cfn-guard-v3-ubuntu-latest/cfn-guard /usr/local/bin/
          cfn-guard --version

      # Runs before any rule is applied to a real template. `cfn-guard validate`
      # exits 0 when a rule file fails to parse, and a rule whose filter selects
      # nothing reports no findings, so both a broken file and a broken rule look
      # exactly like a clean result. Two rule files were unparseable and five
      # rules silently matched nothing -- including one in the blocking set --
      # and every step below reported success throughout.
      #
      # The self-test asserts each rule fires against a non-compliant fixture and
      # stays quiet against a compliant one. Blocking: if the rules are not
      # working, the results of the steps after this one mean nothing.
      - name: Guard rule self-test (blocking)
        run: bash guard/tests/run-guard-selftest.sh

      - name: Run cfn-guard critical rules (blocking)
        run: |
          echo "Running critical cfn-guard rules..."
          for template in integrations/*/template*.yaml shared/templates/*.yaml management-console/templates/*.yaml; do
            if [ -f "$template" ]; then
              echo "Validating: $template"
              cfn-guard validate -d "$template" -r guard/rules/critical-security.guard --show-summary fail
            fi
          done

      # Scoped to management-console/templates/ on purpose. These rules are
      # stricter than critical-security.guard (no wildcard IAM resources, no
      # public task ingress, no public IPs on ECS tasks) and the console stacks
      # are written to meet them. Applying them repo-wide would report the
      # integrations and shared stacks too, which is a separate decision.
      # Applies to every template, not just management-console/templates/.
      #
      # This rule set was scoped to management-console/ because running it wider
      # produced 19 findings. On inspection all but a handful were shapes the
      # rules could not evaluate rather than real problems: roles with only
      # ManagedPolicyArns, Fn::If-wrapped policy entries, and CidrIp /
      # AssignPublicIp values arriving by parameter. Guard reports each of those
      # as non-compliant rather than as "nothing to check", so the rule set would
      # have been dismissed on first contact. The rules now filter those shapes
      # (guard/tests/positive-control.yaml carries one of each so the filters
      # cannot be removed silently), which is what makes repo-wide application
      # meaningful instead of noisy.
      - name: Run management console rules (blocking, all templates)
        run: |
          echo "Running management console cfn-guard rules..."
          for template in integrations/*/template*.yaml shared/templates/*.yaml management-console/templates/*.yaml; do
            if [ -f "$template" ]; then
              echo "Validating: $template"
              cfn-guard validate -d "$template" -r guard/rules/management-console-security.guard --show-summary fail
            fi
          done

      # Now blocking, and no longer described as advisory. Measured across every
      # template at adoption: zero findings from both rule sets. A rule set that
      # reports nothing and cannot fail the build is indistinguishable from one
      # that is not running -- which is the failure the guard self-test above
      # exists to catch, so leaving these two unenforced undercut it.
      - name: Run cfn-guard lambda and secrets rules (blocking)
        run: |
          for template in integrations/*/template*.yaml shared/templates/*.yaml management-console/templates/*.yaml; do
            if [ -f "$template" ]; then
              echo "Validating: $template"
              cfn-guard validate -d "$template" -r guard/rules/lambda-security.guard --show-summary fail
              cfn-guard validate -d "$template" -r guard/rules/secrets-management.guard --show-summary fail
            fi
          done

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      - name: Check for sensitive data in tracked files
        run: |
          echo "Checking for common sensitive patterns..."
          FAILED=0

          # Check .kiro/ is not tracked
          KIRO_COUNT=$(git ls-files .kiro/ | wc -l)
          if [ "${KIRO_COUNT}" -gt 0 ]; then
            echo "❌ .kiro/ files are tracked"
            FAILED=1
          fi

          # Check docs/blog/ is not tracked
          BLOG_COUNT=$(git ls-files docs/blog/ | wc -l)
          if [ "${BLOG_COUNT}" -gt 0 ]; then
            echo "❌ docs/blog/ files are tracked"
            FAILED=1
          fi

          # Check docs/internal/ is not tracked
          INTERNAL_COUNT=$(git ls-files docs/internal/ | wc -l)
          if [ "${INTERNAL_COUNT}" -gt 0 ]; then
            echo "❌ docs/internal/ files are tracked"
            FAILED=1
          fi

          # Check .env is not tracked
          if git ls-files | grep -q "^\.env$"; then
            echo "❌ .env is tracked"
            FAILED=1
          fi

          # Check for personal file paths
          if git ls-files | xargs grep -lE "/Users/[^/]+/(Downloads|Library)/.*\.pem" 2>/dev/null; then
            echo "❌ Personal file paths found in tracked files"
            FAILED=1
          fi

          if [ "${FAILED}" -eq 1 ]; then
            exit 1
          fi
          echo "✅ Security checks passed"

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@314ff8b43182423b84c50b1670b0e10f858f2d98 # master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'

  markdown-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Deliberately stays non-blocking, and this is the one check where that is
      # the right answer. It resolves external URLs, so it fails for reasons
      # outside this repository: vendor documentation reorganising, rate limits,
      # transient DNS or TLS errors, and sites that reject CI user agents. Making
      # it blocking would produce failures no change here can fix, and the usual
      # response to that is to stop reading the check at all.
      #
      # Internal link rot is covered by a gate that can be deterministic instead:
      # scripts/check_agent_context_budget.py fails when AGENTS.md points at a
      # path that does not exist or is untracked.
      - name: Check markdown links
        uses: gaurav-nelson/github-action-markdown-link-check@499c1e7f3637c131334fa8e937c45144f79d72d2 # v1
        with:
          use-quiet-mode: 'yes'
          config-file: '.markdown-link-check.json'
        continue-on-error: true

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Now blocking. Measured clean against every workflow at actionlint 1.7.12,
      # and unlike the link check it is deterministic: it reads the workflow
      # files and nothing else, so a failure is always something in this repo.
      - name: Run actionlint
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  bilingual-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          persist-credentials: false

      # Now blocking. Measured clean ("All bilingual docs are in sync"). Japanese
      # is the primary language here and English must mirror its structure, so a
      # heading-count divergence means one language is missing a section -- a
      # defect, not a style preference. It was non-blocking while the stricter
      # code-block check beside it already blocked, which was inconsistent.
      - name: Check bilingual documentation sync
        run: bash shared/scripts/check-bilingual-sync.sh

      # Blocking, unlike the heading-structure check above. A translated comment
      # inside a ```bash fence means the Japanese guide documents a different
      # command from the verified English one, and that is a defect rather than a
      # style drift. Diagram fences are excluded by the script.
      - name: Check executable code blocks are identical across languages
        run: python3 shared/scripts/sync-code-blocks.py --check
