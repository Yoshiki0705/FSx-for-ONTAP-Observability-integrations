AWSTemplateFormatVersion: '2010-09-09'
Description: |
  FSx for ONTAP S3 Access Points read-throughput benchmark Lambda.

  Deploys the ListObjectsV2 / GetObject latency and throughput benchmark
  (benchmark/s3ap-throughput/handler.py) as a single Lambda. The function is
  invoked separately (benchmark/s3ap-throughput/run-benchmark.sh); this stack
  performs no measurement at deploy time.

  Placement mirrors the doc's test environment: 256 MB memory, 300 s timeout,
  NO VpcConfig (outside-VPC path to an internet-origin S3 Access Point). A VPC
  with a Gateway Endpoint only would time out against an internet-origin AP.

  The execution role is scoped to s3:GetObject + s3:ListBucket on the single
  parameterized S3 Access Points ARN, plus CloudWatch Logs. See the function's
  Metadata.guard.dlq_exempt for why there is no DLQ.

  Stack name pattern: fsxn-s3ap-benchmark

Parameters:
  S3AccessPointArn:
    Type: String
    Description: >-
      ARN of the FSx for ONTAP S3 Access Point to benchmark, e.g.
      arn:aws:s3:ap-northeast-1:123456789012:accesspoint/fsxn-audit-ap. The
      role is scoped to this ARN and its objects only.
    AllowedPattern: '^arn:aws:s3:[a-z0-9-]+:\d{12}:accesspoint/.+'

  BenchmarkRegion:
    Type: String
    Description: >-
      AWS Region the benchmark runs in. Must match the S3 Access Point's
      region; recorded in the result for environment context.
    Default: ap-northeast-1
    AllowedPattern: '^[a-z0-9-]+$'

Resources:
  BenchmarkLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-fn'
      RetentionInDays: 30

  BenchmarkRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3AccessPointReadPolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: ListAccessPoint
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Ref S3AccessPointArn
              - Sid: GetAccessPointObjects
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${S3AccessPointArn}/object/*'
              - Sid: Logs
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-*:*'

  BenchmarkFunction:
    Type: AWS::Lambda::Function
    Metadata:
      guard:
        dlq_exempt: >-
          Invoked synchronously by an operator (run-benchmark.sh / aws lambda
          invoke) for a one-off measurement. Synchronous invocations have no
          asynchronous retry path, so a DLQ can never fire; the error returns
          to the caller directly.
    Properties:
      FunctionName: !Sub '${AWS::StackName}-fn'
      Runtime: python3.12
      Handler: index.lambda_handler
      MemorySize: 256
      Timeout: 300
      Role: !GetAtt BenchmarkRole.Arn
      Environment:
        Variables:
          BENCHMARK_REGION: !Ref BenchmarkRegion
      Code:
        ZipFile: |
          # Generated from benchmark/s3ap-throughput/handler.py -- do not edit here.
          # Regenerate with: python3 shared/scripts/sync-inline-lambda.py
          # shared/python/tests/test_inline_lambda_sync.py fails if the two drift apart.
          """S3 Access Points read-throughput benchmark Lambda for FSx for ONTAP.

          This handler measures ListObjectsV2 and GetObject latency against an FSx for
          ONTAP S3 Access Point and reports percentile latency and derived throughput.
          It performs the measurement only: deployment and invocation are driven
          separately (see template.yaml and run-benchmark.sh), and the handler issues no
          credential handling of its own, relying on the Lambda execution role through
          the default boto3 provider chain.

          The ``Bucket`` parameter passed to boto3 is the S3 Access Points alias OR ARN;
          both are accepted directly as the ``Bucket`` argument by the S3 API.

          Measurement semantics mirror docs/en/s3ap-throughput-benchmark.md:
            - "list": ListObjectsV2 latency over N iterations (p50/p99/mean/min/max ms),
              computed directly over those N samples.
            - "get": GetObject latency and throughput per object, grouped into size
              classes. Per-object figures are computed over that object's iterations.
              Size-class p50/p99/mean/min/max are computed over the POOLED samples of all
              objects in the class (not as a mean of per-object percentiles); the class
              carries ``sample_count`` and ``percentile_method``.

          The statistics math is isolated in pure helpers (``percentile``,
          ``summarize_latencies``, ``bounded_samples``, ``throughput_mbps``) that take no
          AWS dependency, so it is unit-testable offline.
          """

          from __future__ import annotations

          import math
          import os
          import time
          import uuid
          from datetime import datetime, timezone
          from typing import Any

          import boto3

          # Measurements are taken with time.perf_counter and reported in milliseconds.
          _MS_PER_SECOND = 1000.0
          _BYTES_PER_MB = 1024 * 1024

          # Upper bound on the raw per-iteration latencies returned for each object
          # (``samples_ms``). It keeps the synchronous Lambda response small however many
          # iterations are requested: only the first MAX_SAMPLES_PER_OBJECT samples of an
          # object are kept. An object's own p50/p99/mean/min/max still use every
          # iteration; the size-class figures pool only the kept samples.
          MAX_SAMPLES_PER_OBJECT = 100

          # Value of ``percentile_method`` on a size-class summary. Result files written
          # before the class figures were pooled have no such key; their class p50/p99
          # are the mean of each object's own p50/p99.
          PERCENTILE_METHOD = "pooled_nearest_rank"


          def percentile(sorted_values: list[float], fraction: float) -> float:
              """Return the nearest-rank percentile of an already-sorted list.

              Uses a nearest-rank method that never indexes out of range on small N:
              for a sorted list of length ``n`` and a fraction ``p`` in [0, 1], the
              chosen index is ``min(n - 1, ceil(p * n) - 1)`` and is clamped to 0 at the
              low end. This avoids the off-by-one risk of ``sorted(xs)[int(n * p)]``,
              which indexes out of range when ``int(n * p) == n`` (for example p=0.99 at
              n>=100 would select index n and raise IndexError).

              With this method p=0.99 selects the maximum whenever ``n < 100``; at
              ``n == 100`` it selects the second largest sample.

              Args:
                  sorted_values: Latency samples sorted in ascending order. Must be
                      non-empty.
                  fraction: Percentile as a fraction, e.g. 0.5 for p50, 0.99 for p99.

              Returns:
                  The sample at the nearest-rank position.

              Raises:
                  ValueError: If ``sorted_values`` is empty.
              """
              n = len(sorted_values)
              if n == 0:
                  raise ValueError("percentile requires at least one value")
              index = math.ceil(fraction * n) - 1
              if index < 0:
                  index = 0
              if index > n - 1:
                  index = n - 1
              return sorted_values[index]


          def summarize_latencies(latencies_ms: list[float]) -> dict[str, float]:
              """Summarize a list of latency samples (milliseconds).

              Args:
                  latencies_ms: Raw per-iteration latencies in milliseconds. Must be
                      non-empty.

              Returns:
                  A dict with p50_ms, p99_ms, mean_ms, min_ms and max_ms, each rounded to
                  three decimal places. The percentiles are nearest-rank over exactly the
                  samples passed in, so p99_ms is the maximum when fewer than 100 samples
                  are passed.

              Raises:
                  ValueError: If ``latencies_ms`` is empty.
              """
              if not latencies_ms:
                  raise ValueError("summarize_latencies requires at least one sample")
              ordered = sorted(latencies_ms)
              return {
                  "p50_ms": round(percentile(ordered, 0.5), 3),
                  "p99_ms": round(percentile(ordered, 0.99), 3),
                  "mean_ms": round(sum(ordered) / len(ordered), 3),
                  "min_ms": round(ordered[0], 3),
                  "max_ms": round(ordered[-1], 3),
              }


          def bounded_samples(latencies_ms: list[float]) -> list[float]:
              """Return the raw latencies to report for one object, capped in length.

              Keeps the first ``MAX_SAMPLES_PER_OBJECT`` samples in measurement order,
              each rounded to three decimal places (the precision of the summaries).

              Args:
                  latencies_ms: Raw per-iteration latencies in milliseconds, in the order
                      they were measured.

              Returns:
                  A new list of at most ``MAX_SAMPLES_PER_OBJECT`` rounded samples.
              """
              return [round(value, 3) for value in latencies_ms[:MAX_SAMPLES_PER_OBJECT]]


          def throughput_mbps(size_bytes: float, mean_latency_ms: float) -> float:
              """Derive throughput in MB/s from mean latency and object size.

              Args:
                  size_bytes: Mean object size in bytes.
                  mean_latency_ms: Mean GetObject latency in milliseconds.

              Returns:
                  Throughput in MB/s (binary megabytes), rounded to two decimals, or 0.0
                  when latency is non-positive.
              """
              if mean_latency_ms <= 0:
                  return 0.0
              megabytes = size_bytes / _BYTES_PER_MB
              seconds = mean_latency_ms / _MS_PER_SECOND
              return round(megabytes / seconds, 2)


          def _size_label(size_bytes: int) -> str:
              """Group an object size into a rounded, human-readable size label.

              Args:
                  size_bytes: Object size in bytes.

              Returns:
                  A label such as "1KB", "100KB", "1MB", or "0B" for an empty object.
              """
              if size_bytes <= 0:
                  return "0B"
              if size_bytes < 1024:
                  return f"{size_bytes}B"
              if size_bytes < _BYTES_PER_MB:
                  return f"{round(size_bytes / 1024)}KB"
              return f"{round(size_bytes / _BYTES_PER_MB)}MB"


          def _run_list(
              s3: Any, bucket: str, prefix: str, max_keys: int, iterations: int
          ) -> dict[str, Any]:
              """Measure ListObjectsV2 latency over N iterations.

              Args:
                  s3: A boto3 S3 client.
                  bucket: S3 Access Points alias or ARN.
                  prefix: Key prefix to list under.
                  max_keys: MaxKeys per ListObjectsV2 call.
                  iterations: Number of calls to time.

              Returns:
                  A dict with operation, iterations and the latency summary fields. The
                  percentiles are nearest-rank over the ``iterations`` samples of this
                  one series (nothing is pooled or averaged), so p99_ms is the maximum
                  when ``iterations`` is below 100.
              """
              latencies_ms: list[float] = []
              for _ in range(iterations):
                  start = time.perf_counter()
                  s3.list_objects_v2(Bucket=bucket, Prefix=prefix, MaxKeys=max_keys)
                  latencies_ms.append((time.perf_counter() - start) * _MS_PER_SECOND)
              summary = summarize_latencies(latencies_ms)
              return {"operation": "ListObjectsV2", "iterations": iterations, **summary}


          def _list_keys(s3: Any, bucket: str, prefix: str, max_keys: int) -> list[str]:
              """List up to ``max_keys`` object keys under a prefix (one call).

              Args:
                  s3: A boto3 S3 client.
                  bucket: S3 Access Points alias or ARN.
                  prefix: Key prefix to list under.
                  max_keys: Maximum number of keys to return.

              Returns:
                  The object keys (excluding zero-length directory markers).
              """
              resp = s3.list_objects_v2(Bucket=bucket, Prefix=prefix, MaxKeys=max_keys)
              return [item["Key"] for item in resp.get("Contents", []) if not item["Key"].endswith("/")]


          def _run_get(
              s3: Any,
              bucket: str,
              prefix: str,
              max_keys: int,
              iterations: int,
              size_labels: dict[str, str] | None,
          ) -> dict[str, Any]:
              """Measure GetObject latency and throughput per object and per size class.

              Lists up to ``max_keys`` keys under ``prefix`` and reads each key
              ``iterations`` times, fully draining the response body each time. Each
              object's result carries its own summary over all ``iterations`` and a
              ``samples_ms`` list of the raw latencies, capped at
              ``MAX_SAMPLES_PER_OBJECT`` samples per object. The size-class summaries pool
              those ``samples_ms`` lists (see ``_summarize_size_classes``).

              Args:
                  s3: A boto3 S3 client.
                  bucket: S3 Access Points alias or ARN.
                  prefix: Key prefix to list objects under.
                  max_keys: Maximum number of keys to benchmark.
                  iterations: GetObject repetitions per key.
                  size_labels: Optional caller-supplied map of object key to size label.
                      Keys not present fall back to a rounded-size label.

              Returns:
                  A dict with a per-object array and a per-size-class summary.
              """
              keys = _list_keys(s3, bucket, prefix, max_keys)
              per_object: list[dict[str, Any]] = []
              for key in keys:
                  latencies_ms: list[float] = []
                  sizes: list[int] = []
                  for _ in range(iterations):
                      start = time.perf_counter()
                      resp = s3.get_object(Bucket=bucket, Key=key)
                      body = resp["Body"].read()
                      latencies_ms.append((time.perf_counter() - start) * _MS_PER_SECOND)
                      sizes.append(len(body))
                  summary = summarize_latencies(latencies_ms)
                  mean_size = sum(sizes) / len(sizes)
                  label = (size_labels or {}).get(key) or _size_label(round(mean_size))
                  per_object.append({
                      "key": key,
                      "size_bytes": int(round(mean_size)),
                      "size_label": label,
                      "iterations": iterations,
                      "throughput_mbps": throughput_mbps(mean_size, summary["mean_ms"]),
                      **summary,
                      "samples_ms": bounded_samples(latencies_ms),
                  })
              return {
                  "operation": "GetObject",
                  "objects_measured": len(per_object),
                  "per_object": per_object,
                  "per_size_class": _summarize_size_classes(per_object),
              }


          def _summarize_size_classes(per_object: list[dict[str, Any]]) -> list[dict[str, Any]]:
              """Aggregate per-object results into per-size-class summaries.

              The class ``p50_ms``, ``p99_ms``, ``mean_ms``, ``min_ms`` and ``max_ms`` are
              computed over the POOLED ``samples_ms`` of every object in the class: all
              samples are merged into one list and summarized with ``summarize_latencies``
              (nearest-rank percentiles). They are NOT a mean of the per-object
              percentiles, which is how earlier result files were aggregated; those files
              have no ``percentile_method`` key. ``sample_count`` is the size of the pool.
              With nearest-rank, p99 is the maximum unless the pool holds at least 100
              samples (100 samples: the second largest), so a class p99 on fewer than 100
              pooled samples should be read as the maximum. Because each object
              contributes at most ``MAX_SAMPLES_PER_OBJECT`` samples, the pool can be
              smaller than ``object_count * iterations``.

              ``mean_size_bytes`` and ``mean_throughput_mbps`` remain means over the
              class's objects.

              Args:
                  per_object: Per-object measurement dicts produced by ``_run_get``, each
                      including its ``samples_ms`` list.

              Returns:
                  One summary per size label, sorted by mean size, each with size_label,
                  object_count, mean_size_bytes, sample_count, percentile_method, the
                  pooled p50/p99/mean/min/max latency, and mean_throughput_mbps.
              """
              classes: dict[str, list[dict[str, Any]]] = {}
              for obj in per_object:
                  classes.setdefault(obj["size_label"], []).append(obj)
              summaries: list[dict[str, Any]] = []
              for label, objs in classes.items():
                  pooled = [sample for o in objs for sample in o["samples_ms"]]
                  pooled_summary = summarize_latencies(pooled)
                  tputs = [o["throughput_mbps"] for o in objs]
                  sizes = [o["size_bytes"] for o in objs]
                  summaries.append({
                      "size_label": label,
                      "object_count": len(objs),
                      "mean_size_bytes": int(round(sum(sizes) / len(sizes))),
                      "sample_count": len(pooled),
                      "percentile_method": PERCENTILE_METHOD,
                      "p50_ms": pooled_summary["p50_ms"],
                      "p99_ms": pooled_summary["p99_ms"],
                      "mean_ms": pooled_summary["mean_ms"],
                      "min_ms": pooled_summary["min_ms"],
                      "max_ms": pooled_summary["max_ms"],
                      "mean_throughput_mbps": round(sum(tputs) / len(tputs), 2),
                  })
              summaries.sort(key=lambda s: s["mean_size_bytes"])
              return summaries


          def lambda_handler(event: dict[str, Any], context: Any) -> dict[str, Any]:
              """Lambda entry point: route a benchmark event to the list or get test.

              Args:
                  event: One of::

                      {"test": "list", "bucket": "<alias-or-arn>", "prefix": "...",
                       "iterations": 20, "max_keys": 100}
                      {"test": "get", "bucket": "<alias-or-arn>", "prefix": "...",
                       "max_keys": 10, "iterations": 5, "size_labels": {"<key>": "1MB"}}

                      ``iterations`` defaults to 5 for both tests when omitted, and
                      ``max_keys`` defaults to 100 for "list" and 10 for "get". The
                      helper script run-benchmark.sh always sends ``iterations`` (20 for
                      list and 5 for get, unless its environment variables override
                      them), so it does not rely on the Lambda default.
                      ``benchmark_run_id`` is echoed if present, otherwise generated.
                  context: Lambda context (unused).

              Returns:
                  A JSON-serializable dict with the test result plus benchmark_run_id,
                  a UTC ISO-8601 timestamp, and the region.

              Raises:
                  ValueError: For a missing ``bucket`` or an unknown ``test`` value.
              """
              test = event.get("test")
              bucket = event.get("bucket")
              if not bucket:
                  raise ValueError("event must include 'bucket' (S3 Access Points alias or ARN)")

              prefix = event.get("prefix", "")
              iterations = int(event.get("iterations", 5))
              region = os.environ.get("AWS_REGION", "")
              s3 = boto3.client("s3")

              if test == "list":
                  max_keys = int(event.get("max_keys", 100))
                  result = _run_list(s3, bucket, prefix, max_keys, iterations)
              elif test == "get":
                  max_keys = int(event.get("max_keys", 10))
                  size_labels = event.get("size_labels")
                  result = _run_get(s3, bucket, prefix, max_keys, iterations, size_labels)
              else:
                  raise ValueError(f"unknown test {test!r}: expected 'list' or 'get'")

              return {
                  "benchmark_run_id": event.get("benchmark_run_id") or f"bench-{uuid.uuid4().hex[:12]}",
                  "timestamp_utc": datetime.now(timezone.utc).isoformat(),
                  "region": region,
                  "result": result,
              }
    DependsOn: BenchmarkLogGroup

Outputs:
  BenchmarkFunctionArn:
    Description: ARN of the benchmark Lambda; invoke it with run-benchmark.sh.
    Value: !GetAtt BenchmarkFunction.Arn

  BenchmarkFunctionName:
    Description: Name of the benchmark Lambda function.
    Value: !Ref BenchmarkFunction
