# OTel Collector Configuration — Production Hardened
#
# ✅ Based on validation config with production additions:
# - memory_limiter processor (before batch)
# - sending_queue on each exporter
# - retry_on_failure on each exporter
# - Internal telemetry metrics enabled, and now actually reachable: the
#   collector previously would not start with this file at all
#
# Validated against the version the compose files pin. Do not restate that
# version here -- a version in a comment is what went stale last time. See
# docker-compose.yaml for the pinned tag.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 5s
    send_batch_size: 1000
    send_batch_max_size: 5000

exporters:
  otlp_http/grafana:
    endpoint: ${env:GRAFANA_OTLP_ENDPOINT}
    headers:
      Authorization: "Basic ${env:GRAFANA_BASIC_AUTH}"
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

  otlp_http/honeycomb:
    endpoint: https://api.honeycomb.io
    headers:
      x-honeycomb-team: ${env:HONEYCOMB_API_KEY}
      x-honeycomb-dataset: ${env:HONEYCOMB_DATASET}
    sending_queue:
      enabled: true
      num_consumers: 10
      queue_size: 5000
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 300s

extensions:
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  telemetry:
    metrics:
      level: detailed
      # `address: 0.0.0.0:8888` was here and the collector refused to start on
      # it: `'migration.MetricsConfigV030' has invalid keys: address`. The key
      # was replaced by an OpenTelemetry-Go `readers` block. Verified to fail on
      # both 0.152.0 and 0.160.0, so this file has not been startable for some
      # time -- the CI validation could not fail, so nothing reported it.
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp_http/grafana, otlp_http/honeycomb]
