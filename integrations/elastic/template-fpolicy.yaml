AWSTemplateFormatVersion: '2010-09-09'
Description: >
  FSx for ONTAP Elastic FPolicy Integration - Lambda function for receiving
  FPolicy file operation events from EventBridge and forwarding to Elasticsearch.
  Prerequisite: Deploy shared/templates/fpolicy-apigw.yaml first.

Parameters:
  ElasticApiKeySecretArn:
    Type: String
    Description: Secrets Manager ARN containing Elastic API key
    AllowedPattern: 'arn:aws:secretsmanager:[a-z0-9-]+:\d{12}:secret:.+'
  ElasticEndpoint:
    Type: String
    Description: Elasticsearch cluster endpoint URL
    AllowedPattern: 'https://.+'
  EventBusName:
    Type: String
    Default: fsxn-fpolicy-events
    Description: EventBridge custom bus name from fpolicy-apigw.yaml
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
  LambdaMemorySize:
    Type: Number
    Default: 256
    MinValue: 128
    MaxValue: 1024
  LambdaTimeout:
    Type: Number
    Default: 30
    MinValue: 5
    MaxValue: 300
  FPolicySqsQueueArn:
    Type: String
    Default: ''
    Description: >-
      ARN of the SQS queue that receives FPolicy events from the Fargate server
      (deployed by shared/templates/fpolicy-apigw.yaml, resource IngestionQueue).
      When provided, an SQS event source mapping is created — this is the PRIMARY
      trigger path. The EventBridge rule below is the secondary path. Leave empty
      to use EventBridge only.

  AlarmNotificationTopicArn:
    Type: String
    Default: ''
    Description: >-
      (Optional) SNS topic ARN notified when the alarms in this stack fire.
      Leave empty to create the alarms without notification actions — they will
      be visible in the CloudWatch console but will not page anyone.

Conditions:
  HasFPolicySqsQueue: !Not [!Equals [!Ref FPolicySqsQueueArn, '']]
  HasAlarmTopic: !Not [!Equals [!Ref AlarmNotificationTopicArn, '']]

Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-dlq'
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs

  FpolicyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref ElasticApiKeySecretArn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogGroup, logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-handler:*'
        - PolicyName: DLQ
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DeadLetterQueue.Arn
        - Fn::If:
            - HasFPolicySqsQueue
            - PolicyName: SQSFPolicyAccess
              PolicyDocument:
                Version: '2012-10-17'
                Statement:
                  - Effect: Allow
                    Action:
                      - sqs:ReceiveMessage
                      - sqs:DeleteMessage
                      - sqs:GetQueueAttributes
                    Resource:
                      - !Ref FPolicySqsQueueArn
            - !Ref AWS::NoValue

  FpolicyHandlerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-handler'
      Runtime: python3.12
      Handler: fpolicy_handler.lambda_handler
      Code:
        ZipFile: "def lambda_handler(e,c): raise NotImplementedError"
      Role: !GetAtt FpolicyLambdaRole.Arn
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      DeadLetterConfig:
        TargetArn: !GetAtt DeadLetterQueue.Arn
      Environment:
        Variables:
          API_KEY_SECRET_ARN: !Ref ElasticApiKeySecretArn
          ELASTIC_ENDPOINT: !Ref ElasticEndpoint
          LOG_LEVEL: !Ref LogLevel

  FpolicyEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-fpolicy-trigger'
      EventBusName: !Ref EventBusName
      State: ENABLED
      EventPattern:
        source: [fpolicy.fsxn]
      Targets:
        - Id: FpolicyLambda
          Arn: !GetAtt FpolicyHandlerFunction.Arn

  EventBridgeLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FpolicyHandlerFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FpolicyEventRule.Arn

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-handler'
      RetentionInDays: 30

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-errors'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions: [{Name: FunctionName, Value: !Ref FpolicyHandlerFunction}]
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmNotificationTopicArn
        - !Ref AWS::NoValue

  DeadLetterQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-dead-letter-queue-depth'
      AlarmDescription: >-
        Messages have landed in the DeadLetterQueue dead-letter queue. Every message here
        is telemetry that was never delivered. Drain it with the DLQ
        replay runbook (docs/en/runbooks/dlq-replay.md) — messages are retained
        for 14 days and are lost after that.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmNotificationTopicArn
        - !Ref AWS::NoValue

  # ============================================================
  # SQS Event Source Mapping — FPolicy SQS -> FPolicy Lambda
  # (Primary trigger path: Fargate -> SQS -> Lambda -> vendor)
  # ============================================================
  FPolicySqsEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: HasFPolicySqsQueue
    Properties:
      EventSourceArn: !Ref FPolicySqsQueueArn
      FunctionName: !GetAtt FpolicyHandlerFunction.Arn
      BatchSize: 10
      Enabled: true
      # Required for the handler's batchItemFailures response to take effect.
      # Without it, SQS deletes every message in the batch as soon as the
      # invocation returns without raising — silently dropping up to
      # BatchSize events whenever delivery to the vendor fails.
      FunctionResponseTypes:
        - ReportBatchItemFailures

Outputs:
  LambdaFunctionArn:
    Value: !GetAtt FpolicyHandlerFunction.Arn
  DeadLetterQueueArn:
    Value: !GetAtt DeadLetterQueue.Arn
