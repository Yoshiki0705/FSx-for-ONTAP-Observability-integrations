AWSTemplateFormatVersion: '2010-09-09'
Description: FSx for ONTAP Sumo Logic Integration - Audit log shipping via HTTP Source

Parameters:
  S3AccessPointArn:
    Type: String
    Description: FSx for ONTAP S3 Access Point ARN
    AllowedPattern: 'arn:aws:s3:[a-z0-9-]+:\d{12}:accesspoint/.+'
  SumoLogicHttpSourceSecretArn:
    Type: String
    Description: Secrets Manager ARN for Sumo Logic HTTP Source URL
    AllowedPattern: 'arn:aws:secretsmanager:[a-z0-9-]+:\d{12}:secret:.+'
  S3BucketName:
    Type: String
    Description: S3 bucket name for EventBridge rule matching
  S3KeyPrefix:
    Type: String
    Default: ''
    Description: S3 key prefix filter for audit log objects
  SourceCategory:
    Type: String
    Default: aws/fsxn/audit
    Description: Sumo Logic source category (X-Sumo-Category header)
  SourceName:
    Type: String
    Default: fsxn-ontap-audit
    Description: Sumo Logic source name (X-Sumo-Name header)
  LogLevel:
    Type: String
    Default: INFO
    AllowedValues: [DEBUG, INFO, WARNING, ERROR]
    Description: Lambda log level. Use DEBUG when troubleshooting delivery
  LambdaMemorySize:
    Type: Number
    Default: 256
    Description: Lambda memory in MB. Raise it if large EVTX files run out of memory
  LambdaTimeout:
    Type: Number
    Default: 300
    Description: Lambda timeout in seconds. Must exceed the time needed to process one batch of files
  AlarmNotificationTopicArn:
    Type: String
    Default: ''
    Description: >-
      (Optional) SNS topic ARN notified when the alarms in this stack fire.
      Leave empty to create the alarms without notification actions — they will
      be visible in the CloudWatch console but will not page anyone.

Conditions:
  HasAlarmTopic: !Not [!Equals [!Ref AlarmNotificationTopicArn, '']]

Resources:
  DeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-dlq'
      MessageRetentionPeriod: 1209600
      KmsMasterKeyId: alias/aws/sqs

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-lambda-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: S3Read
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: s3:GetObject
                Resource: !Sub '${S3AccessPointArn}/object/*'
        - PolicyName: Secrets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource: !Ref SumoLogicHttpSourceSecretArn
        - PolicyName: Logs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-shipper:*'
        - PolicyName: DLQ
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: sqs:SendMessage
                Resource: !GetAtt DeadLetterQueue.Arn

  LogShipperFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-shipper'
      Runtime: python3.12
      Handler: handler.lambda_handler
      Code:
        ZipFile: "def lambda_handler(e,c): raise NotImplementedError"
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      DeadLetterConfig:
        TargetArn: !GetAtt DeadLetterQueue.Arn
      Environment:
        Variables:
          API_KEY_SECRET_ARN: !Ref SumoLogicHttpSourceSecretArn
          S3_ACCESS_POINT_ARN: !Ref S3AccessPointArn
          SOURCE_CATEGORY: !Ref SourceCategory
          SOURCE_NAME: !Ref SourceName
          LOG_LEVEL: !Ref LogLevel

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-shipper'
      RetentionInDays: 30

  EventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-s3-event'
      State: ENABLED
      EventPattern:
        source: [aws.s3]
        detail-type: [Object Created]
        detail:
          bucket: {name: [!Ref S3BucketName]}
          object: {key: [{prefix: !Ref S3KeyPrefix}]}
      Targets:
        - Id: Target
          Arn: !GetAtt LogShipperFunction.Arn

  LambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref LogShipperFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt EventBridgeRule.Arn

  ErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-errors'
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref LogShipperFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 5
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmNotificationTopicArn
        - !Ref AWS::NoValue

  DeadLetterQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-dead-letter-queue-depth'
      AlarmDescription: >-
        Messages have landed in the DeadLetterQueue dead-letter queue. Every message here
        is telemetry that was never delivered. Drain it with the DLQ
        replay runbook (docs/en/runbooks/dlq-replay.md) — messages are retained
        for 14 days and are lost after that.
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt DeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmNotificationTopicArn
        - !Ref AWS::NoValue

Outputs:
  LambdaFunctionArn:
    Value: !GetAtt LogShipperFunction.Arn
  DeadLetterQueueArn:
    Value: !GetAtt DeadLetterQueue.Arn
  DeadLetterQueueUrl:
    Value: !Ref DeadLetterQueue
