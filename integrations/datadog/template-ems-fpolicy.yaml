AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  FSx for ONTAP Datadog EMS & FPolicy Integration - Serverless event shipping
  for ONTAP EMS webhook events and FPolicy file operation events.
  Stack name pattern: fsxn-datadog-ems-fpolicy

# DEPLOYMENT NOTE:
# This template creates named IAM roles (RoleName property), so deployment
# requires --capabilities CAPABILITY_NAMED_IAM (not just CAPABILITY_IAM).
# Example:
#   aws cloudformation deploy \
#     --template-file template-ems-fpolicy.yaml \
#     --stack-name fsxn-datadog-ems-fpolicy \
#     --parameter-overrides \
#       DatadogApiKeySecretArn=arn:aws:secretsmanager:ap-northeast-1:123456789012:secret:fsxn-datadog-api-key-XXXXXX \
#     --capabilities CAPABILITY_NAMED_IAM

Parameters:
  DatadogApiKeySecretArn:
    Type: String
    Description: ARN of the Secrets Manager secret containing the Datadog API key
    AllowedPattern: 'arn:aws:secretsmanager:[a-z0-9-]+:\d{12}:secret:.+'

  DatadogSite:
    Type: String
    Default: ap1.datadoghq.com
    AllowedValues:
      - datadoghq.com
      - us3.datadoghq.com
      - us5.datadoghq.com
      - datadoghq.eu
      - ap1.datadoghq.com
      - ap2.datadoghq.com
      - ddog-gov.com
    Description: >-
      Datadog site (determines API endpoint region).
      US1=datadoghq.com, US3=us3.datadoghq.com, US5=us5.datadoghq.com,
      EU1=datadoghq.eu, AP1(Tokyo)=ap1.datadoghq.com, AP2=ap2.datadoghq.com,
      US1-FED=ddog-gov.com

  EventBridgeBusName:
    Type: String
    Default: default
    Description: EventBridge bus name for FPolicy events (custom bus deployed by fpolicy-apigw.yaml)

  FPolicySqsQueueArn:
    Type: String
    Default: ''
    Description: >-
      ARN of the SQS queue receiving FPolicy events from the Fargate server.
      If provided, creates an SQS event source mapping for the FPolicy Lambda.
      This is the PRIMARY trigger path (SQS → Lambda). The EventBridge rule
      serves as a secondary/alternative path.

  EmsParserLayerArn:
    Type: String
    Default: ''
    Description: ARN of the shared EMS parser Lambda Layer (optional)

  LogLevel:
    Type: String
    Default: INFO
    AllowedValues:
      - DEBUG
      - INFO
      - WARNING
      - ERROR
    Description: Lambda function log level

  Environment:
    Type: String
    Default: production
    Description: Environment tag for Datadog logs (DD_ENV)

  EnableGzip:
    Type: String
    Default: 'false'
    AllowedValues:
      - 'true'
      - 'false'
    Description: Enable gzip compression for log payloads sent to Datadog

  LambdaMemorySize:
    Type: Number
    Default: 256
    MinValue: 128
    MaxValue: 3008
    Description: Lambda function memory size in MB

  LambdaTimeout:
    Type: Number
    Default: 60
    MinValue: 10
    MaxValue: 900
    Description: Lambda function timeout in seconds

  SqsBatchSize:
    Type: Number
    Default: 10
    MinValue: 1
    MaxValue: 10000
    Description: >-
      Number of FPolicy SQS messages delivered to the Lambda per invocation.
      Partial failures are reported per message (ReportBatchItemFailures), so a
      larger batch does not risk re-delivering successfully shipped events.

  AlarmNotificationTopicArn:
    Type: String
    Default: ''
    Description: >-
      (Optional) SNS topic ARN notified when an error or DLQ alarm fires.
      Leave empty to create the alarms without notification actions — they will
      be visible in the CloudWatch console but will not page anyone.

Conditions:
  HasEmsParserLayer: !Not [!Equals [!Ref EmsParserLayerArn, '']]
  HasFPolicySqsQueue: !Not [!Equals [!Ref FPolicySqsQueueArn, '']]
  HasAlarmTopic: !Not [!Equals [!Ref AlarmNotificationTopicArn, '']]

Resources:
  # ============================================================
  # Dead Letter Queue — asynchronous FPolicy invocations
  #
  # Scope note: this DLQ only captures the EventBridge (asynchronous) path.
  #   - SQS path      : failures are reported per message via
  #                     ReportBatchItemFailures and redriven by the ingestion
  #                     queue's own RedrivePolicy (see fpolicy-apigw.yaml).
  #   - EventBridge   : after 2 automatic retries the invocation lands here.
  #   - EMS webhook   : invoked synchronously by API Gateway, so Lambda
  #                     DeadLetterConfig never applies — an EMS failure surfaces
  #                     as a 5xx to ONTAP and is caught by EmsErrorAlarm instead.
  # ============================================================
  FPolicyDeadLetterQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: !Sub '${AWS::StackName}-fpolicy-dlq'
      MessageRetentionPeriod: 1209600  # 14 days (maximum)
      KmsMasterKeyId: alias/aws/sqs
      Tags:
        - Key: Project
          Value: fsxn-observability
        - Key: Vendor
          Value: datadog

  # Allows the EventBridge rule to write undeliverable events to the DLQ.
  # Without this policy EventBridge silently drops them.
  FPolicyDeadLetterQueuePolicy:
    Type: AWS::SQS::QueuePolicy
    Properties:
      Queues:
        - !Ref FPolicyDeadLetterQueue
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowEventBridgeDeadLetterDelivery
            Effect: Allow
            Principal:
              Service: events.amazonaws.com
            Action: sqs:SendMessage
            Resource: !GetAtt FPolicyDeadLetterQueue.Arn
            Condition:
              ArnEquals:
                aws:SourceArn: !GetAtt FPolicyEventBridgeRule.Arn

  # ============================================================
  # CloudWatch Log Groups
  # ============================================================
  EmsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-ems'
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: fsxn-observability
        - Key: Vendor
          Value: datadog

  FPolicyLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-fpolicy'
      RetentionInDays: 30
      Tags:
        - Key: Project
          Value: fsxn-observability
        - Key: Vendor
          Value: datadog

  # ============================================================
  # IAM Roles
  # ============================================================
  EmsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-ems-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SecretsManagerRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatadogApiKeySecretArn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-ems:*'
      Tags:
        - Key: Project
          Value: fsxn-observability
        - Key: Vendor
          Value: datadog

  FPolicyLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-fpolicy-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: SecretsManagerRead
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - !Ref DatadogApiKeySecretArn
        - PolicyName: CloudWatchLogs
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-fpolicy:*'
        - !If
          - HasFPolicySqsQueue
          - PolicyName: SQSFPolicyAccess
            PolicyDocument:
              Version: '2012-10-17'
              Statement:
                - Effect: Allow
                  Action:
                    - sqs:ReceiveMessage
                    - sqs:DeleteMessage
                    - sqs:GetQueueAttributes
                  Resource:
                    - !Ref FPolicySqsQueueArn
          - !Ref AWS::NoValue
        - PolicyName: SQSDeadLetterWrite
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource:
                  - !GetAtt FPolicyDeadLetterQueue.Arn
      Tags:
        - Key: Project
          Value: fsxn-observability
        - Key: Vendor
          Value: datadog

  # ============================================================
  # EMS Lambda Function
  # ============================================================
  EmsLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-ems'
      Runtime: python3.12
      Handler: ems_handler.lambda_handler
      Architectures:
        - arm64
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Role: !GetAtt EmsLambdaRole.Arn
      Layers: !If
        - HasEmsParserLayer
        - - !Ref EmsParserLayerArn
        - !Ref AWS::NoValue
      Environment:
        Variables:
          DATADOG_SITE: !Ref DatadogSite
          API_KEY_SECRET_ARN: !Ref DatadogApiKeySecretArn
          LOG_LEVEL: !Ref LogLevel
          DD_SOURCE: fsxn-ems
          DD_SERVICE: fsxn-ontap
          DD_ENV: !Ref Environment
          ENABLE_GZIP: !Ref EnableGzip
      LoggingConfig:
        LogGroup: !Ref EmsLogGroup
      # Placeholder only. CloudFormation cannot inline the full handler, so the
      # real lambda/ems_handler.py must be uploaded after the stack is created.
      # `scripts/deploy.sh` does this automatically as its final step.
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              raise NotImplementedError(
                  "Placeholder code is still deployed. Upload the real "
                  "ems_handler: bash integrations/datadog/scripts/deploy.sh "
                  "(or see docs/en/ems-fpolicy-setup.md)"
              )
      Tags:
        - Key: Project
          Value: fsxn-observability
        - Key: Vendor
          Value: datadog

  # ============================================================
  # FPolicy Lambda Function
  # ============================================================
  FPolicyLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-fpolicy'
      Runtime: python3.12
      Handler: fpolicy_handler.lambda_handler
      Architectures:
        - arm64
      MemorySize: !Ref LambdaMemorySize
      Timeout: !Ref LambdaTimeout
      Role: !GetAtt FPolicyLambdaRole.Arn
      # Applies to the asynchronous EventBridge path only (see DLQ scope note).
      DeadLetterConfig:
        TargetArn: !GetAtt FPolicyDeadLetterQueue.Arn
      Environment:
        Variables:
          DATADOG_SITE: !Ref DatadogSite
          API_KEY_SECRET_ARN: !Ref DatadogApiKeySecretArn
          LOG_LEVEL: !Ref LogLevel
          DD_SOURCE: fsxn-fpolicy
          DD_SERVICE: fsxn-ontap
          DD_ENV: !Ref Environment
          ENABLE_GZIP: !Ref EnableGzip
      LoggingConfig:
        LogGroup: !Ref FPolicyLogGroup
      # Placeholder only. CloudFormation cannot inline the full handler, so the
      # real lambda/fpolicy_handler.py must be uploaded after the stack is created.
      # `scripts/deploy.sh` does this automatically as its final step.
      Code:
        ZipFile: |
          def lambda_handler(event, context):
              raise NotImplementedError(
                  "Placeholder code is still deployed. Upload the real "
                  "fpolicy_handler: bash integrations/datadog/scripts/deploy.sh "
                  "(or see docs/en/ems-fpolicy-setup.md)"
              )
      Tags:
        - Key: Project
          Value: fsxn-observability
        - Key: Vendor
          Value: datadog

  # ============================================================
  # EventBridge Rule — FPolicy events → FPolicy Lambda
  # ============================================================
  FPolicyEventBridgeRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub '${AWS::StackName}-fpolicy-to-datadog'
      Description: Route FPolicy file operation events to Datadog shipper Lambda
      EventBusName: !Ref EventBridgeBusName
      State: ENABLED
      EventPattern:
        source:
          - fpolicy.fsxn
      Targets:
        - Id: FPolicyDatadogLambda
          Arn: !GetAtt FPolicyLambdaFunction.Arn
          # Captures events EventBridge could not deliver to Lambda at all
          # (e.g. throttling, permission errors) — complements the Lambda DLQ,
          # which captures failures that happen inside the function.
          DeadLetterConfig:
            Arn: !GetAtt FPolicyDeadLetterQueue.Arn
          RetryPolicy:
            MaximumRetryAttempts: 3
            MaximumEventAgeInSeconds: 3600

  FPolicyLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FPolicyLambdaFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt FPolicyEventBridgeRule.Arn

  # ============================================================
  # SQS Event Source Mapping — FPolicy SQS → FPolicy Lambda
  # (Primary trigger path: Fargate → SQS → Lambda → Datadog)
  # ============================================================
  FPolicySqsEventSourceMapping:
    Type: AWS::Lambda::EventSourceMapping
    Condition: HasFPolicySqsQueue
    Properties:
      EventSourceArn: !Ref FPolicySqsQueueArn
      FunctionName: !GetAtt FPolicyLambdaFunction.Arn
      BatchSize: !Ref SqsBatchSize
      Enabled: true
      # Required for fpolicy_handler's per-message failure reporting. Without
      # this, the handler's batchItemFailures response is ignored and a single
      # failed message causes the entire batch to be re-delivered.
      FunctionResponseTypes:
        - ReportBatchItemFailures

  # ============================================================
  # CloudWatch Alarms
  # ============================================================
  # EMS is invoked synchronously by API Gateway, so there is no DLQ to watch —
  # this alarm is the only signal that ONTAP EMS events are being rejected.
  EmsErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-ems-errors'
      AlarmDescription: >-
        EMS webhook Lambda is failing; ONTAP is receiving 5xx from API Gateway
        and EMS events are being lost. Runbook: docs/en/runbooks/lambda-errors.md
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref EmsLambdaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmNotificationTopicArn
        - !Ref AWS::NoValue

  FPolicyErrorAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-fpolicy-errors'
      AlarmDescription: >-
        FPolicy Lambda error rate exceeded threshold. On the SQS path this means
        messages are being retried and will reach the ingestion DLQ.
        Runbook: docs/en/runbooks/lambda-errors.md
      Namespace: AWS/Lambda
      MetricName: Errors
      Dimensions:
        - Name: FunctionName
          Value: !Ref FPolicyLambdaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 3
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmNotificationTopicArn
        - !Ref AWS::NoValue

  FPolicyThrottleAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-fpolicy-throttles'
      AlarmDescription: >-
        FPolicy Lambda is being throttled. FPolicy events arrive at file-operation
        rate, so sustained throttling causes SQS backlog growth and eventual
        message expiry.
      Namespace: AWS/Lambda
      MetricName: Throttles
      Dimensions:
        - Name: FunctionName
          Value: !Ref FPolicyLambdaFunction
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmNotificationTopicArn
        - !Ref AWS::NoValue

  FPolicyDLQAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub '${AWS::StackName}-fpolicy-dlq-messages'
      AlarmDescription: >-
        Messages in the FPolicy Dead Letter Queue — these file operation events
        never reached Datadog. Runbook: docs/en/runbooks/dlq-replay.md
      Namespace: AWS/SQS
      MetricName: ApproximateNumberOfMessagesVisible
      Dimensions:
        - Name: QueueName
          Value: !GetAtt FPolicyDeadLetterQueue.QueueName
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: !If
        - HasAlarmTopic
        - - !Ref AlarmNotificationTopicArn
        - !Ref AWS::NoValue

Outputs:
  EmsLambdaFunctionArn:
    Description: >-
      ARN of the EMS Lambda function. Pass this as the LambdaFunctionArn
      parameter when deploying shared/templates/ems-webhook-apigw.yaml.
    Value: !GetAtt EmsLambdaFunction.Arn

  FPolicyLambdaFunctionArn:
    Description: ARN of the FPolicy Lambda function
    Value: !GetAtt FPolicyLambdaFunction.Arn

  FPolicyEventBridgeRuleArn:
    Description: ARN of the EventBridge rule routing FPolicy events to Lambda
    Value: !GetAtt FPolicyEventBridgeRule.Arn

  FPolicyDeadLetterQueueUrl:
    Description: >-
      URL of the FPolicy Dead Letter Queue (asynchronous EventBridge path).
      Replay procedure: docs/en/runbooks/dlq-replay.md
    Value: !Ref FPolicyDeadLetterQueue

  FPolicyDeadLetterQueueArn:
    Description: ARN of the FPolicy Dead Letter Queue
    Value: !GetAtt FPolicyDeadLetterQueue.Arn
