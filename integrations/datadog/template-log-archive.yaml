AWSTemplateFormatVersion: '2010-09-09'
Description: >
  Datadog Log Archive — S3 bucket + IAM role for FSx for ONTAP audit log archival.
  Enables Datadog Log Rehydration for compliance investigations.

Parameters:
  ArchiveBucketName:
    Type: String
    Description: S3 bucket name for Datadog log archive
    Default: ''
  DatadogAwsAccountId:
    Type: String
    Description: Datadog's AWS account ID (for IAM trust)
    Default: '464622532012'
    AllowedValues:
      - '464622532012'  # Datadog US1/AP1
      - '417141415827'  # Datadog EU1
  DatadogExternalId:
    Type: String
    Description: External ID from Datadog AWS Integration page
    NoEcho: true
  RetentionDays:
    Type: Number
    Description: Days to keep logs in Standard before transitioning to Glacier
    Default: 30
    MinValue: 1
    MaxValue: 365
  GlacierRetentionDays:
    Type: Number
    Description: Total days to retain in Glacier (set based on compliance requirement)
    Default: 2555
    MinValue: 365
    MaxValue: 2920
  KmsKeyArn:
    Type: String
    Description: KMS CMK ARN for S3 bucket encryption (leave empty for AES256)
    Default: ''

Conditions:
  GenerateBucketName: !Equals [!Ref ArchiveBucketName, '']
  UseKmsEncryption: !Not [!Equals [!Ref KmsKeyArn, '']]

Resources:
  ArchiveBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !If
        - GenerateBucketName
        - !Sub 'fsxn-datadog-archive-${AWS::AccountId}-${AWS::Region}'
        - !Ref ArchiveBucketName
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: !If [UseKmsEncryption, 'aws:kms', 'AES256']
              KMSMasterKeyID: !If [UseKmsEncryption, !Ref KmsKeyArn, !Ref 'AWS::NoValue']
            BucketKeyEnabled: !If [UseKmsEncryption, true, !Ref 'AWS::NoValue']
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          - Id: TransitionToGlacier
            Status: Enabled
            Transitions:
              - StorageClass: GLACIER
                TransitionInDays: !Ref RetentionDays
            ExpirationInDays: !Ref GlacierRetentionDays
      Tags:
        - Key: Project
          Value: fsxn-observability
        - Key: Purpose
          Value: datadog-log-archive

  ArchiveBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ArchiveBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          # Scoped to the archive role, NOT to the Datadog account root.
          #
          # Datadog does not call S3 with its own credentials — it assumes
          # DatadogArchiveRole (below) and calls S3 as that role, which lives in
          # this account. Same-account access via an IAM role is authorized by
          # the role's identity policy, so this bucket policy is defense in
          # depth: it names the only principal allowed to write.
          #
          # Granting the Datadog account root here with an `sts:ExternalId`
          # condition does not work: sts:ExternalId only exists in the request
          # context of sts:AssumeRole, never in an S3 request, so the condition
          # can never match. The external ID belongs on the role trust policy,
          # which is where it is actually enforced.
          - Sid: DatadogLogArchiveRoleAccess
            Effect: Allow
            Principal:
              AWS: !GetAtt DatadogArchiveRole.Arn
            Action:
              - s3:PutObject
              - s3:GetObject
              - s3:ListBucket
              - s3:GetBucketLocation
            Resource:
              - !GetAtt ArchiveBucket.Arn
              - !Sub '${ArchiveBucket.Arn}/*'
          - Sid: DenyUnencryptedTransport
            Effect: Deny
            Principal: '*'
            Action: 's3:*'
            Resource:
              - !GetAtt ArchiveBucket.Arn
              - !Sub '${ArchiveBucket.Arn}/*'
            Condition:
              Bool:
                'aws:SecureTransport': false

  DatadogArchiveRole:
    Type: AWS::IAM::Role
    Properties:
      # Stack-scoped so the template can be deployed more than once (multiple
      # regions, or a separate archive per environment). A fixed RoleName makes
      # the second deployment fail with AlreadyExists.
      RoleName: !Sub '${AWS::StackName}-archive-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${DatadogAwsAccountId}:root'
            Action: sts:AssumeRole
            Condition:
              StringEquals:
                'sts:ExternalId': !Ref DatadogExternalId
      Policies:
        - PolicyName: DatadogLogArchiveAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:GetBucketLocation
                Resource:
                  - !GetAtt ArchiveBucket.Arn
                  - !Sub '${ArchiveBucket.Arn}/*'

Outputs:
  ArchiveBucketName:
    Description: S3 bucket for Datadog log archive
    Value: !Ref ArchiveBucket
  ArchiveBucketArn:
    Description: ARN of the archive bucket
    Value: !GetAtt ArchiveBucket.Arn
  ArchiveRoleArn:
    Description: IAM Role ARN for Datadog archive access
    Value: !GetAtt DatadogArchiveRole.Arn
  DatadogArchiveConfig:
    Description: Use these values in Datadog Log Archive configuration
    Value: !Sub |
      Bucket: ${ArchiveBucket}
      Path: /fsxn-audit-logs
      Region: ${AWS::Region}
      Role: ${DatadogArchiveRole}
      Account: ${AWS::AccountId}
